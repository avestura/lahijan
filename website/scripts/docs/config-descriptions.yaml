# Descriptions for the generated configuration reference
# (website/src/content/docs/reference/configuration.md). One entry per leaf
# key of internal/app/lahijan/conf/.lahijan.conf.default.yaml.
sections:
  general:
    title: General
    intro: >-
      Two top-level keys: `environment` decides whether Lahijan accepts
      development fallbacks for missing secrets, and `debug` raises the log
      level.
  http:
    title: HTTP server
    intro: >-
      The HTTP server that serves the Lahijan API and the health check
      endpoints: listen address, request limits, CORS, request logging and
      probes. See [Observability](/docs/operations/observability) for logs
      and [TLS and domains](/docs/operations/tls-and-domains) for running
      behind a reverse proxy.
  database:
    title: Database
    intro: >-
      Connection to the PostgreSQL database that holds all Lahijan data,
      including the River job queue. Lahijan never migrates the schema on its
      own; see [Upgrades](/docs/operations/upgrades).
  auth:
    title: Authentication
    intro: >-
      Sign-up, password hashing, browser sessions, access tokens, email links,
      single sign-on (OAuth, OpenID Connect, SAML) and multi-factor
      authentication. [Authentication](/docs/operations/authentication)
      walks through setting up each identity provider.
  smtp:
    title: Email (SMTP)
    intro: >-
      The SMTP server Lahijan uses to send account emails such as email
      verification and password reset links.
  jobs:
    title: Background jobs
    intro: >-
      The durable job queue, built on River and stored in PostgreSQL. Usage
      metering and other asynchronous work run through it. See
      [Jobs](/docs/admin/jobs).
  wasm:
    title: Plugins
    intro: >-
      The WebAssembly plugin runtime (wazero) and the plugin marketplace.
      These limits apply to every plugin; a plugin's own manifest can only
      lower them. See [Plugins](/docs/admin/plugins) and
      [Marketplace](/docs/admin/marketplace).
  providers:
    title: Infrastructure backends
    intro: >-
      Connections to the backends that do the actual work: Incus for compute,
      PowerDNS for DNS, a domain registrar for domain sales and SeaweedFS for
      object storage. Each backend is used only when its `enabled` key is
      true; otherwise the matching feature reports itself as disabled.
  bootstrap:
    title: First-run admin
    intro: >-
      Creates the first platform administrator when Lahijan starts against an
      empty database. It does nothing once any user exists. See
      [Installation](/docs/getting-started/installation).
  billing:
    title: Billing
    intro: >-
      Card payments through Stripe. Balances, top-ups by an administrator and
      usage charges work without it. See [Payments](/docs/billing/payments)
      and [Billing administration](/docs/admin/billing).
  agent:
    title: Agent
    intro: >-
      The AI agent chat in the dashboard. See [Agent](/docs/agent/overview)
      and [Agent policy](/docs/admin/agent-policy).
groups:
  http.server: Listen address, connection limits and request size for the HTTP server.
  http.server.cors: >-
    Cross-origin resource sharing (CORS) headers. Only needed when a web app
    on a different origin calls the Lahijan API from the browser.
  http.server.logger: Per-request access logging.
  http.server.healthcheck: >-
    Liveness and readiness endpoints for Docker, load balancers and
    orchestrators. Both answer as long as the process is running; they do not
    check the database or the backends.
  auth.signup: What happens when a user registers on their own.
  auth.password: Password hashing parameters and the password policy.
  auth.session: Browser session and refresh cookies.
  auth.pat: Personal access tokens that users create for API access.
  auth.email: Single-use links sent by email for verification, password reset and email change.
  auth.signing: Key that signs session cookies and email links.
  auth.secrets: Key that encrypts tokens received from external identity providers.
  auth.oauth: >-
    Sign-in with Google and GitHub through OAuth 2.0. Each provider is keyed
    by a name that appears in its URLs. The flow always uses PKCE.
  auth.oidc: >-
    Sign-in with any OpenID Connect identity provider, such as Keycloak,
    Auth0 or Okta. The key under `providers` (here `keycloak`) is the name
    used in the provider's URLs.
  auth.saml: >-
    SAML 2.0 single sign-on, with Lahijan as the service provider. Works with
    Microsoft Entra ID, Okta, OneLogin, Shibboleth and other SAML identity
    providers. The key under `providers` (here `entra`) is the name used in
    the provider's URLs.
  auth.mfa: >-
    Multi-factor authentication. Authenticator app codes (TOTP) and recovery
    codes work without extra setup; security keys and passkeys (WebAuthn)
    need `webauthn.rpId` and `webauthn.rpOrigins`.
  jobs.adminUI: River's built-in web interface for inspecting and managing jobs.
  wasm.marketplace: >-
    Where Lahijan reads the plugin marketplace index
    (`plugins-marketplace.yaml`). When neither `path` nor `url` is set, the
    marketplace is disabled.
  wasm.wasi: Settings for plugins that run in WASI mode.
  providers.incus: How Lahijan connects to the Incus daemon that runs instances, and how tenants map to Incus projects.
  providers.incus.projectFeatures: >-
    Incus project features turned on when Lahijan creates a tenant's project.
    Each one gives the tenant its own copy of that resource type instead of
    sharing the default project's.
  providers.incus.events: The live event stream from Incus, forwarded to plugins.
  providers.incus.tls: >-
    Client certificate authentication for a remote Incus daemon reached over
    HTTPS. All values are PEM-encoded. Not used with the Unix socket.
  providers.incus.placement: How Lahijan picks the cluster member for a new instance.
  providers.incus.floatingIPs: How floating IPs are routed to instances. See [Floating IPs](/docs/compute/floating-ips).
  providers.powerdns: How Lahijan connects to the PowerDNS Authoritative server, and defaults for new zones.
  providers.powerdns.events: Change events for DNS zones and records, forwarded to plugins.
  providers.registrar: Domain registration and resale through a registrar reseller account. See [Domains](/docs/dns/domains).
  providers.registrar.openSRS: Credentials and endpoint for the OpenSRS (Tucows) reseller API.
  providers.seaweedfs: >-
    How Lahijan connects to SeaweedFS. Lahijan manages buckets and
    credentials; users send object data straight to the SeaweedFS S3 endpoint.
  providers.seaweedfs.events: Change events for buckets and credentials, forwarded to plugins.
  billing.stripe: The Stripe payment gateway. When it is off, the payment endpoints report the feature as disabled.
  agent.billing: What the agent charges to a tenant's balance.
keys:
  environment: >-
    Name of the deployment environment, such as `dev`, `stg` or `prd`. The
    values `dev`, `development`, `local` and an empty string (any case) count
    as development, where Lahijan fills in insecure stand-ins for missing
    secrets. In any other environment, `auth.signing.key`,
    `auth.secrets.encryptionKey` and (with SAML) the SAML signing key and
    certificate must be set or the server refuses to start.
  debug: >-
    Turns on trace-level logging and extra startup messages. Leave it off in
    production; it makes the logs much larger.

  http.server.port: TCP port the HTTP server listens on.
  http.server.host: >-
    Address the HTTP server binds to. `0.0.0.0` listens on every IPv4
    interface; `127.0.0.1` accepts local connections only, for example when a
    reverse proxy runs on the same host.
  http.server.concurrency: >-
    Maximum number of concurrent connections. When not set, it is computed at
    startup from the Fiber web framework default of 262144 connections.
  http.server.bodylimit: >-
    Maximum request body size, in bytes. Larger requests are rejected. When
    not set, it is computed at startup from the Fiber web framework default
    of 4194304 bytes (4 MiB). Raise it if administrators upload plugin
    modules bigger than 4 MiB, since this limit applies before
    `wasm.maxModuleSize`.
  http.server.prefork: >-
    Starts one server process per CPU, all sharing the same port. Each child
    process runs the full server, including background workers, so leave it
    off unless you have tested it for your setup.
  http.server.cors.enabled: >-
    Adds CORS headers to responses. Turn it on only if a browser app served
    from another origin calls the API directly.
  http.server.cors.allowHeaders: >-
    Request headers that cross-origin requests may send, such as
    `Content-Type` or `Authorization`.
  http.server.cors.allowMethods: HTTP methods that cross-origin requests may use, such as `GET` or `POST`.
  http.server.cors.allowOrigins: >-
    Origins allowed to call the API from the browser, written as scheme and
    host, for example `https://app.example.com`.
  http.server.cors.maxAge: >-
    How long browsers may cache a CORS preflight response, in seconds. `0`
    sends no max-age, so the browser uses its own default.
  http.server.logger.enabled: Writes one log line for every HTTP request.
  http.server.logger.colors: >-
    Intended to toggle colored request logs. The current server does not read
    this key.
  http.server.healthcheck.enabled: Serves the liveness and readiness endpoints.
  http.server.healthcheck.readinessEndpoint: Path of the readiness endpoint.
  http.server.healthcheck.livenessEndpoint: Path of the liveness endpoint.

  database.host: Host name or IP address of the PostgreSQL server.
  database.port: TCP port of the PostgreSQL server.
  database.name: Name of the PostgreSQL database Lahijan uses.
  database.user: PostgreSQL user Lahijan connects as.
  database.password: >-
    Password of the PostgreSQL user. Set it through the environment variable,
    never commit it.
  database.sslmode: >-
    TLS mode for the database connection: `disable`, `require`, `verify-ca`
    or `verify-full`. Use `verify-full` when PostgreSQL runs on another host.
  database.maxConns: Maximum number of connections in the pool.
  database.minConns: Number of connections the pool keeps open even when idle.
  database.maxConnLifetimeSeconds: >-
    Maximum age of a pooled connection, in seconds. Older connections are
    closed and replaced.
  database.maxConnIdleSeconds: >-
    How long an unused connection may stay open, in seconds, before it is
    closed.
  database.statementTimeoutMs: >-
    Maximum run time of a single SQL statement, in milliseconds. PostgreSQL
    cancels statements that run longer. `0` turns the limit off.

  auth.signup.personalTenant: >-
    Gives every user who signs up a personal tenant that they own. Without a
    tenant, a new account can open the dashboard but cannot create anything.
    Turn it off if you add users to tenants yourself. See
    [Users and tenants](/docs/admin/users-and-tenants).
  auth.password.argon2.memory: >-
    Memory used to hash one password with argon2id, in KiB (65536 KiB is
    64 MiB). Higher values make stolen hashes harder to crack but make every
    sign-in use more memory. Existing hashes keep working after a change.
  auth.password.argon2.iterations: Number of argon2id passes (time cost). Higher is slower and harder to crack.
  auth.password.argon2.parallelism: Number of threads argon2id uses for one hash.
  auth.password.argon2.saltLength: Length of the random salt stored with each password hash, in bytes.
  auth.password.argon2.keyLength: Length of the derived hash, in bytes.
  auth.password.minLength: >-
    Minimum number of characters in a new password. Passwords must also
    contain at least three of: lowercase letters, uppercase letters, digits
    and symbols.
  auth.password.breachCheck.enabled: >-
    Intended to check new passwords against the Have I Been Pwned breach
    list. Not implemented yet; the current server does not read this key.

  auth.session.cookieName: Name of the cookie that holds the browser session.
  auth.session.refreshCookieName: Name of the cookie that holds the refresh token, which renews the session.
  auth.session.domain: >-
    Domain attribute of the session cookies. Empty means the cookies belong
    to the exact host that served them. Set a parent domain only if several
    subdomains must share the session.
  auth.session.secure: >-
    Marks the cookies as HTTPS-only. Set it to true in production; browsers
    then refuse to send the cookies over plain HTTP.
  auth.session.sameSite: >-
    SameSite attribute of the cookies: `strict`, `lax` or `none`. `lax` suits
    most setups. `none` requires `secure` to be true.
  auth.session.path: URL path the cookies apply to.
  auth.session.lifetimeSeconds: >-
    Session lifetime, in seconds. The window slides forward while the user is
    active.
  auth.session.refreshLifetimeSeconds: >-
    Lifetime of the refresh token, in seconds. After it expires the user must
    sign in again.

  auth.pat.prefix: >-
    Text placed at the start of every personal access token so users and
    secret scanners can recognize it.
  auth.pat.byteLength: Number of random bytes in each personal access token, before encoding.
  auth.email.verificationTTLSeconds: How long an email verification link stays valid, in seconds.
  auth.email.passwordResetTTLSeconds: How long a password reset link stays valid, in seconds.
  auth.email.emailChangeTTLSeconds: How long the confirmation link for an email address change stays valid, in seconds.
  auth.email.byteLength: Number of random bytes in each email link token.

  auth.signing.key: >-
    Secret key that signs session cookies and email links. Required outside
    development: the server refuses to start without it. Use a long random
    value. Changing it signs every user out and invalidates links already
    sent. Set it through the environment variable, never commit it.
  auth.secrets.encryptionKey: >-
    Key that encrypts tokens from external identity providers before they are
    stored: 32 random bytes, base64-encoded (for example the output of
    `openssl rand -base64 32`). Required outside development. Changing it
    makes tokens already stored unreadable. Set it through the environment
    variable, never commit it.

  auth.oauth.providers.google.enabled: Turns on sign-in with Google.
  auth.oauth.providers.google.clientId: OAuth client ID from the Google Cloud console.
  auth.oauth.providers.google.clientSecret: >-
    OAuth client secret from the Google Cloud console. Set it through the
    environment variable, never commit it.
  auth.oauth.providers.google.scopes: >-
    OAuth scopes requested from Google. `openid`, `email` and `profile` are
    the minimum needed to link accounts.
  auth.oauth.providers.github.enabled: Turns on sign-in with GitHub.
  auth.oauth.providers.github.clientId: Client ID of the GitHub OAuth app.
  auth.oauth.providers.github.clientSecret: >-
    Client secret of the GitHub OAuth app. Set it through the environment
    variable, never commit it.
  auth.oauth.providers.github.scopes: OAuth scopes requested from GitHub.
  auth.oauth.redirectBase: >-
    Public base URL of Lahijan, for example `https://app.example.com`. The
    callback URL is this base plus `/api/v1/auth/oauth/<provider>/callback`;
    register that URL with the provider. Empty derives the base from the
    request's host, which only works for local development.

  auth.oidc.providers.keycloak.enabled: Turns on sign-in with this OpenID Connect provider.
  auth.oidc.providers.keycloak.issuer: >-
    Issuer URL of the provider, for example
    `https://sso.example.com`. Lahijan reads the provider's
    discovery document from it.
  auth.oidc.providers.keycloak.clientId: Client ID registered with the provider.
  auth.oidc.providers.keycloak.clientSecret: >-
    Client secret registered with the provider. Set it through the
    environment variable, never commit it.
  auth.oidc.providers.keycloak.scopes: OpenID Connect scopes requested at sign-in.
  auth.oidc.redirectBase: >-
    Public base URL of Lahijan. The callback URL is this base plus
    `/api/v1/auth/oidc/<provider>/callback`. Empty derives it from the
    request's host, which only works for local development.

  auth.saml.spSigningKey: >-
    PEM-encoded RSA private key that Lahijan uses to sign its SAML requests
    and metadata. Required outside development; in development an empty
    value makes Lahijan generate a new key pair at every start. Set it
    through the environment variable (or its file variant), never commit it.
  auth.saml.spSigningCert: >-
    PEM-encoded X.509 certificate that matches `spSigningKey`. It is
    published in the service provider metadata so identity providers can
    verify Lahijan's requests. Required outside development.
  auth.saml.redirectBase: >-
    Public base URL that Lahijan advertises for its SAML endpoints, for
    example `https://app.example.com`. Empty derives it from the request's
    host, which only works for local development.
  auth.saml.jit.enabled: >-
    Creates a Lahijan account automatically the first time an unknown user
    signs in through SAML, using the attributes the identity provider sends.
    Leave it off if an administrator must create accounts first.
  auth.saml.providers.entra.enabled: Turns on this SAML identity provider.
  auth.saml.providers.entra.entityId: >-
    Entity ID of Lahijan as the service provider, as registered with the
    identity provider. Usually Lahijan's SAML metadata URL.
  auth.saml.providers.entra.idpMetadataXML: >-
    The identity provider's metadata XML, pasted inline. When set,
    `idpMetadataURL` is ignored.
  auth.saml.providers.entra.idpMetadataURL: >-
    URL of the identity provider's metadata. Lahijan fetches it once at
    startup. Used only when `idpMetadataXML` is empty.
  auth.saml.providers.entra.allowIdpInitiated: >-
    Accepts sign-ins that start at the identity provider instead of at
    Lahijan. Leave it off unless you need it: unsolicited SAML responses are
    a known cross-site request forgery risk.
  auth.saml.providers.entra.emailAttribute: >-
    Name of the SAML attribute that holds the user's email address. Empty
    uses the standard claim URI that Entra ID, Okta and most providers send.
  auth.saml.providers.entra.nameAttribute: >-
    Name of the SAML attribute that holds the user's display name. Empty uses
    the standard claim URI.

  auth.mfa.pendingTTLSeconds: >-
    How long a user has to complete the second factor after entering their
    password, in seconds.
  auth.mfa.maxAttempts: >-
    Number of wrong second-factor codes allowed in one sign-in attempt. After
    that the attempt is cancelled and the user must enter their password
    again.
  auth.mfa.totp.issuer: Name shown next to the account in the user's authenticator app.
  auth.mfa.recovery.count: Number of recovery codes generated in each batch.
  auth.mfa.webauthn.rpId: >-
    WebAuthn relying party ID: the domain users reach the dashboard on, such
    as `app.example.com`, or a parent domain of it. Empty turns off security
    keys and passkeys.
  auth.mfa.webauthn.rpDisplayName: Name shown in the browser prompt when a user registers or uses a security key.
  auth.mfa.webauthn.rpOrigins: >-
    Origins allowed to use WebAuthn, each written as scheme, host and
    optional port. Must include the dashboard origin, for example
    `https://app.example.com`.
  auth.mfa.webauthn.rpTopOrigins: >-
    Top-level origins allowed when the dashboard is embedded in a frame on
    another site. Leave it empty unless you embed the dashboard.

  smtp.enabled: Sends account emails. When false, no email is sent, so users cannot verify addresses or reset passwords by email.
  smtp.host: Host name of the SMTP server.
  smtp.port: TCP port of the SMTP server, such as 587 for STARTTLS or 1025 for MailHog in development.
  smtp.user: SMTP user name. Empty connects without authentication.
  smtp.password: SMTP password. Set it through the environment variable, never commit it.
  smtp.from: Sender address of every email.
  smtp.fromName: Sender name shown next to the address.
  smtp.appBaseURL: >-
    Public URL of the dashboard, for example `https://app.example.com`. Links
    in emails start with it, so a wrong value produces broken links.

  jobs.enabled: >-
    Runs the background job queue. When false, queued work such as usage
    metering does not run and the jobs admin pages report the feature as
    disabled.
  jobs.maxAttempts: Number of times a failing job is tried before it is given up, unless the job sets its own limit.
  jobs.jobTimeoutSeconds: Maximum run time of one job, in seconds, unless the job sets its own limit.
  jobs.softStopTimeoutSeconds: >-
    On shutdown, how long to wait for running jobs to finish, in seconds,
    before cancelling them.
  jobs.defaultMaxWorkersPerQueue: >-
    Number of jobs each queue may run at the same time. Raise it on larger
    hosts.
  jobs.pollOnly: >-
    Checks for new jobs by polling instead of PostgreSQL LISTEN/NOTIFY. Turn
    it on when Lahijan connects through PgBouncer in transaction pooling
    mode.
  jobs.adminUI.enabled: >-
    Serves River's web interface. Only users with the `platform.jobs.read`
    permission can open it.
  jobs.adminUI.path: URL path the jobs web interface is served under.
  wasm.enabled: >-
    Runs the plugin system. When false, plugin administration and the
    marketplace report the feature as disabled. Plugin records stay in the
    database, so turning it back on needs no migration.
  wasm.maxMemoryPerPlugin: >-
    Maximum memory one plugin instance may use, in bytes (33554432 is
    32 MiB). Plugins that declare a larger memory limit are rejected.
  wasm.execTimeoutMs: >-
    Maximum time one call into a plugin may take, in milliseconds. Longer
    calls are cancelled.
  wasm.maxModuleSize: >-
    Maximum size of an uploaded plugin module, in bytes (10485760 is 10 MiB).
    Keep `http.server.bodylimit` at least this large.
  wasm.marketplace.path: >-
    Local directory that contains `plugins-marketplace.yaml` at its top
    level. A relative path is resolved from Lahijan's working directory. Used
    when `url` is empty.
  wasm.marketplace.url: >-
    HTTP or HTTPS address that serves the marketplace index. When set, it
    takes precedence over `path`.
  wasm.marketplace.cacheTtlSeconds: >-
    How long the marketplace index is cached, in seconds. A local index is
    also reread when its file changes.
  wasm.wasi.fsRoot: >-
    Directory that holds the files of WASI plugins. Each plugin gets its own
    subdirectory and cannot reach outside it. The current server does not
    turn on WASI mode, so this key has no effect yet.

  providers.incus.enabled: >-
    Connects to Incus. When false, compute features report themselves as
    disabled. When true, Lahijan checks the connection at startup.
  providers.incus.socketPath: >-
    Path to the Incus daemon's Unix socket. Used when `remoteURL` is empty.
    The Lahijan and Incus containers must share this path.
  providers.incus.remoteURL: >-
    HTTPS address of a remote Incus daemon, for example
    `https://incus.lan:8443`. When set, it is used instead of the Unix socket
    and needs the certificates under `tls`.
  providers.incus.requestTimeoutSeconds: >-
    Timeout for one request to Incus, in seconds. Long operations such as
    copying an image are tracked separately and are not limited by it.
  providers.incus.projectPrefix: >-
    Prefix of the Incus project created for each tenant. The project name is
    this prefix followed by the tenant ID. Do not change it once tenants
    exist, or Lahijan loses track of their projects.
  providers.incus.projectFeatures.images: Gives each tenant its own images.
  providers.incus.projectFeatures.profiles: Gives each tenant its own profiles.
  providers.incus.projectFeatures.networks: >-
    Gives each tenant its own networks. Incus allows this only with OVN, so
    leave it off unless your Incus uses OVN. When off, tenant instances
    attach to `defaultNetwork`.
  providers.incus.projectFeatures.storageVolumes: Gives each tenant its own storage volumes.
  providers.incus.projectFeatures.storageBuckets: Gives each tenant its own storage buckets.
  providers.incus.defaultNetwork: >-
    Incus network added as `eth0` to each tenant's default profile when
    per-tenant networks are off. `lahijanbr` is the bridge created by the
    bundled Incus preseed. Empty adds no network interface.
  providers.incus.featuredImages: >-
    Image aliases shown first in the image catalog, such as `ubuntu/24.04`.
    Incus must be able to fetch them from its image server; list only
    releases that the server still publishes. See
    [Images](/docs/compute/images).
  providers.incus.events.enabled: >-
    Keeps a connection open to the Incus event stream and forwards events to
    plugins. Turn it off when no real Incus daemon is available.
  providers.incus.events.maxReconnectSeconds: >-
    Longest wait between reconnect attempts after the event stream drops, in
    seconds.
  providers.incus.events.maxPayloadBytes: Largest event accepted from Incus, in bytes. Larger events are dropped and logged.
  providers.incus.tls.serverCert: >-
    Certificate of the remote Incus server, used to verify it. Needed when
    the server uses a self-signed certificate.
  providers.incus.tls.clientCert: Client certificate that Lahijan presents to Incus. It must be trusted by the Incus daemon.
  providers.incus.tls.clientKey: >-
    Private key of the client certificate. Set it through the environment
    variable, never commit it.
  providers.incus.tls.insecureSkipVerify: >-
    Skips verification of the Incus server certificate. For testing only;
    never turn it on in production.
  providers.incus.placement.mode: >-
    Where new instances go. `local` lets Incus decide, which is right for a
    single server. `cluster` makes Lahijan pick the least loaded member of an
    Incus cluster for each new instance; it requires a clustered Incus. See
    [Compute cluster](/docs/admin/compute-cluster).
  providers.incus.floatingIPs.forwardNetwork: >-
    Incus network on which Lahijan creates a network forward when a floating
    IP is attached, so traffic to that IP reaches the instance. Empty means
    Lahijan does not create forwards and you route floating IPs yourself (for
    example with BGP or static routes).

  providers.powerdns.enabled: Connects to PowerDNS. When false, DNS features report themselves as disabled.
  providers.powerdns.baseURL: Address of the PowerDNS HTTP API.
  providers.powerdns.apiKey: >-
    API key that PowerDNS expects. Required when PowerDNS is enabled; the
    server refuses to start without it. Set it through the environment
    variable, never commit it.
  providers.powerdns.requestTimeoutSeconds: Timeout for one request to PowerDNS, in seconds.
  providers.powerdns.defaultNameservers: >-
    Name servers written into the SOA and NS records of every new zone. The
    first one is the primary. Use fully qualified names; a trailing dot is
    added if missing.
  providers.powerdns.defaultDNSSECEnabled: >-
    Turns on DNSSEC for every new zone. When false, DNSSEC is turned on per
    zone. See [DNSSEC](/docs/dns/dnssec).
  providers.powerdns.defaultAXFREnabled: >-
    Intended to allow zone transfers (AXFR) for new zones. The current server
    does not read this key.
  providers.powerdns.defaultAXFRFrom: >-
    IP addresses or CIDR ranges intended to be allowed to transfer new zones.
    The current server does not read this key.
  providers.powerdns.events.enabled: >-
    Sends an event to plugins for every zone and record change Lahijan makes.
    Only has an effect when the plugin system is on.

  providers.registrar.enabled: >-
    Connects to a domain registrar so users can search, register and renew
    domains. When false, domain features report themselves as disabled.
  providers.registrar.provider: >-
    Registrar to use: `opensrs` or `noop`. `noop` keeps the domain features
    wired but connects to no registrar, which is useful for testing.
  providers.registrar.openSRS.baseURL: Address of the OpenSRS reseller API. The default is the production endpoint.
  providers.registrar.openSRS.apiKey: >-
    OpenSRS reseller API key. Required when the provider is `opensrs`; the
    server refuses to start without it. Set it through the environment
    variable, never commit it.
  providers.registrar.openSRS.username: OpenSRS reseller account user name.
  providers.registrar.openSRS.requestTimeoutSeconds: Timeout for one request to OpenSRS, in seconds.
  providers.registrar.marginPercent: >-
    Markup added to the registrar's price, as a whole percentage. `0` sells
    domains at cost.
  providers.registrar.defaultCurrency: Currency domain prices are billed in, as a three-letter ISO 4217 code.
  providers.seaweedfs.enabled: >-
    Connects to SeaweedFS. When false, object storage features report
    themselves as disabled.
  providers.seaweedfs.s3Endpoint: Address of the SeaweedFS S3 API that Lahijan uses internally.
  providers.seaweedfs.publicEndpoint: >-
    Public address of the S3 API that users' S3 clients and browsers reach,
    for example `https://s3.example.com`. Presigned URLs are signed for this
    host. Empty uses `s3Endpoint`, which only works inside the Docker
    network. See [TLS and domains](/docs/operations/tls-and-domains).
  providers.seaweedfs.corsAllowedOrigins: >-
    Browser origins allowed to use presigned URLs, usually the dashboard
    origin such as `https://app.example.com`. They are written into every
    bucket's CORS rules. Empty makes uploads and downloads from the dashboard
    fail.
  providers.seaweedfs.usePathStyle: >-
    Path-style S3 addresses (`https://host/bucket/key`). SeaweedFS requires
    them, and the current server always uses them regardless of this key.
  providers.seaweedfs.region: >-
    Region name sent with S3 requests. SeaweedFS ignores it, but it must not
    be empty.
  providers.seaweedfs.adminAccessKey: >-
    Access key of the SeaweedFS S3 admin account. It must match the key the
    SeaweedFS container is started with. Required when SeaweedFS is enabled.
    Set it through the environment variable, never commit it.
  providers.seaweedfs.adminSecretKey: >-
    Secret key of the SeaweedFS S3 admin account. Required when SeaweedFS is
    enabled. Set it through the environment variable, never commit it.
  providers.seaweedfs.filerURL: Address of the SeaweedFS Filer HTTP API, used for bucket metadata and user credentials.
  providers.seaweedfs.requestTimeoutSeconds: Timeout for one request to SeaweedFS, in seconds.
  providers.seaweedfs.defaultPresignTTLSeconds: >-
    Lifetime of a presigned URL when the request does not set one, in
    seconds. See [Presigned URLs](/docs/storage/presigned-urls).
  providers.seaweedfs.defaultQuotaMiB: >-
    Size limit set on each new bucket in SeaweedFS, in MiB. `0` sets no limit
    in SeaweedFS; Lahijan's own quotas still apply. See
    [Quotas](/docs/storage/quotas).
  providers.seaweedfs.events.enabled: >-
    Sends an event to plugins for every bucket and credential change Lahijan
    makes. Only has an effect when the plugin system is on.

  bootstrap.enabled: >-
    Creates the first platform administrator on an empty database. When
    false, no administrator is created and you must add one another way.
  bootstrap.adminEmail: Email address of the first administrator. Empty skips the bootstrap.
  bootstrap.adminPassword: >-
    Password of the first administrator. Empty generates a random password
    and prints it once in the server log (`docker compose logs lahijan`).
    Change it after the first sign-in. Set it through the environment
    variable, never commit it.
  bootstrap.adminDisplayName: Display name of the first administrator.
  bootstrap.generatedPasswordLength: Length of the generated password, in characters, when `adminPassword` is empty.

  billing.stripe.enabled: >-
    Turns on card payments through Stripe. When false, payment endpoints
    report the feature as disabled and webhook calls from Stripe are accepted
    and ignored.
  billing.stripe.secretKey: >-
    Stripe secret key (`sk_test_...` or `sk_live_...`). Required when Stripe
    is enabled. Set it through the environment variable, never commit it.
  billing.stripe.publishableKey: >-
    Stripe publishable key (`pk_test_...` or `pk_live_...`). It is sent to
    the dashboard, so it is not secret.
  billing.stripe.webhookSecret: >-
    Signing secret of the Stripe webhook endpoint (`whsec_...`), used to
    verify that webhook calls come from Stripe. Set it through the
    environment variable, never commit it.
  billing.stripe.apiBaseURL: Address of the Stripe API. Change it only for testing.
  billing.stripe.apiVersion: >-
    Stripe API version to request. Empty uses the version built into
    Lahijan.
  billing.stripe.requestTimeoutSeconds: >-
    Timeout for one request to Stripe, in seconds. `0` or a negative value
    falls back to 30 seconds.

  agent.enabled: Turns on the AI agent chat. When false, agent features report themselves as disabled.
  agent.defaultConversationTitle: Title given to a new conversation when the user does not provide one.
  agent.maxMessageBytes: Largest message a user can send to the agent, in bytes (65536 is 64 KiB).
  agent.billing.centsPer1kTokens: >-
    Price charged to the tenant's balance for every 1000 model tokens, in
    cents, when the agent uses a model key provided by the platform. Turns
    that use the tenant's own model key are free.
