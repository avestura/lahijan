<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0a0a0a" />
    <!--
      The <html lang/dir> attributes are rehydrated from the locale + theme
      stores on bootstrap (see src/main.tsx). The static values here are the
      sensible English/light defaults that show before JS executes, so the
      very first paint matches the most likely visitor.

      <title> and <meta name="description"> are emitted per-route by
      <SeoHead> via vite-react-ssg's <Head> at build time, so they appear
      in every prerendered HTML file. They are intentionally absent here.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
