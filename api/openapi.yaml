# Lahijan Cloud Platform - OpenAPI 3.1 specification
#
# This file is the SINGLE SOURCE OF TRUTH for Lahijan's public HTTP API.
# Generated code (Go server types, Go client SDK, TypeScript schema + client)
# is produced from it by `make openapi-gen`. CI fails if the spec drifts from
# the committed generated code (see .github/workflows/openapi.yml).
#
# Rules (see ADR-0015 and docs/architecture/conventions.md#http-api):
#   - All public routes live under /api/v1/.
#   - Every error response uses the standard Error envelope.
#   - Backend infrastructure names (Incus, PowerDNS, SeaweedFS) NEVER appear
#     here; use the user-facing terms (compute / dns / object storage).

openapi: 3.1.0
info:
  title: Lahijan Cloud Platform API
  version: 0.1.0
  description: |
    Self-service API for compute, DNS, and object storage. Lahijan wraps the
    operator's infrastructure and exposes a single, tenant-scoped surface.

    All timestamps are RFC 3339 UTC strings. All ids are UUIDs.
  contact:
    name: Lahijan Maintainers
    url: https://github.com/avestura/lahijan
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Same-origin (served behind the dashboard).

# ---------------------------------------------------------------------------
# Conventions for tags: one per user-facing module. Infrastructure-level
# endpoints (health, ping) use the "platform" tag.
# ---------------------------------------------------------------------------
tags:
  - name: platform
    description: Infrastructure endpoints (health, liveness, ping).
  - name: auth
    description: Authentication and the current user.
  - name: audit
    description: The append-only audit trail of privileged actions.
  - name: admin
    description: Platform-admin endpoints (cross-tenant; platform.admin role only).
  - name: compute
    description: Compute instances, images, profiles, networks, and storage volumes.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Service health probe
      description: |
        Returns the service health. Intended for orchestrators and load
        balancers; not a privileged endpoint.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ping:
    get:
      tags: [platform]
      operationId: ping
      summary: Round-trip probe for the API pipeline
      description: |
        Returns a pong with the current server timestamp. Proves the OpenAPI
        -> oapi-codegen -> Fiber pipeline is wired end to end. Emits an
        OpenTelemetry trace span.
      security: []
      responses:
        "200":
          description: Pong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user account
      description: |
        Creates a user with an argon2id password hash, opens a session, issues a
        refresh token (set as cookies), and emails a verification link. The
        response returns the new user; the session cookie and refresh-token
        cookie are set on the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Verifies credentials and opens a session. Sets the session and
        refresh-token cookies; returns the authenticated user.

        When MFA is required (the user has at least one enrolled factor OR
        any of their tenant memberships has mfa_required = TRUE), the
        response is 202 Accepted with a pending_session_token instead of
        200 OK with a session. The caller then completes the MFA challenge
        at /api/v1/auth/mfa/challenge to obtain the real session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: |
            MFA challenge required. The pending_session_token is also set
            in a short-lived cookie (lahijan_mfa_pending) for browser
            clients. Exchange it for the real session at
            /api/v1/auth/mfa/challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAChallengeRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out the current session
      description: |
        Revokes the session and every refresh token in its family, then clears
        the session and refresh cookies. Idempotent.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token
      description: |
        Consumes the presented refresh token (from the cookie or body) and
        issues a new one in the same family. Reusing a previously rotated
        token revokes the whole family and the session (reuse detection) and
        returns 401.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed; new cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email verification token
      description: |
        Consumes the single-use token emailed at registration (or via
        resend-verification) and marks the user's email verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the email verification link
      description: |
        Issues a fresh verify-email token and emails the link. Returns the same
        response whether or not the email is registered (no enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification email sent (or would be sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password-reset link
      description: |
        Emails a single-use reset link to the user if the account exists.
        Always returns 200 (no account enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Reset email sent (or would be sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Reset the password with a token
      description: |
        Consumes the single-use reset token and sets the new password. The new
        password is strength-validated; the consumed token cannot be reused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Current authenticated user
      description: Returns the user identified by the session cookie or PAT.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      operationId: updateCurrentUser
      summary: Update the current user's profile
      description: |
        Updates display name and/or locale and/or password. A password change
        requires currentPassword. An email change requests a confirmation
        email and does not swap the email until confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated; the new user state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/personal-access-tokens:
    get:
      tags: [auth]
      operationId: listPersonalAccessTokens
      summary: List the current user's PATs
      description: Returns the caller's non-revoked personal access tokens.
      responses:
        "200":
          description: The caller's PATs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      operationId: createPersonalAccessToken
      summary: Issue a personal access token
      description: |
        Mints a PAT with the requested scopes and expiry. The raw token is
        returned exactly once in the response body; only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalAccessTokenRequest"
      responses:
        "201":
          description: The new PAT (raw token included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/personal-access-tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: deletePersonalAccessToken
      summary: Revoke a personal access token
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # External identity providers (WS-07a): OAuth 2.0 social login + OIDC.
  # -------------------------------------------------------------------------
  # Each provider has a start + callback pair. The start endpoint mints a
  # signed state token + PKCE verifier, sets them as short-lived cookies, and
  # 302s the browser to the IdP. The callback verifies the state, exchanges
  # the code for tokens, fetches the profile, and either logs the user in or
  # links the identity to the logged-in user (via the lahijan_link_uid cookie
  # set by the start endpoint when called from an authenticated session).

  /api/v1/auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: startOAuth
      summary: Begin an OAuth 2.0 social-login flow
      description: |
        Mints a signed CSRF state token + PKCE verifier, sets them as
        short-lived cookies, and 302s the browser to the IdP's authorization
        endpoint.

        When called from an authenticated session (the user is linking a new
        IdP to their existing account) the response also sets a
        lahijan_link_uid cookie carrying the user's id; the callback enforces
        the link against the user who started the flow.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The configured OAuth provider key (e.g. google, github).
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the IdP authorization URL.
          headers:
            Location:
              description: The absolute IdP authorization URL.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The provider key is not configured or not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: callbackOAuth
      summary: Finish an OAuth 2.0 social-login flow
      description: |
        Consumes the IdP's redirect (?code + ?state), verifies the state
        against the cookie nonce, exchanges the code for tokens (with PKCE),
        fetches the profile, and either:
          - logs the user in (sets the session + refresh cookies), or
          - links the identity to the logged-in user (when lahijan_link_uid
            is set), or
          - returns a "completion required" envelope when the IdP returned no
            email and no user could be created.

        On success the browser is redirected to the dashboard root (`/`); on
        failure it is redirected to the login page with an error query.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the dashboard or login page.
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/oidc/{provider}/start:
    get:
      tags: [auth]
      operationId: startOIDC
      summary: Begin an OpenID Connect flow
      description: |
        Same cookie + state pattern as /auth/oauth/{provider}/start but for
        OIDC providers. Mints the PKCE verifier AND the OIDC nonce in addition
        to the state token; both are persisted as short-lived cookies.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the IdP authorization URL.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The provider key is not configured or not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/oidc/{provider}/callback:
    get:
      tags: [auth]
      operationId: callbackOIDC
      summary: Finish an OpenID Connect flow
      description: |
        Consumes the IdP's redirect, verifies state + nonce, exchanges the
        code for an access_token + id_token, verifies the id_token (signature
        via JWKS, audience, expiry, nonce), and either logs the user in or
        links the identity.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the dashboard or login page.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # External identity providers (WS-07b): SAML 2.0 service-provider flow.
  # -------------------------------------------------------------------------
  # Three endpoints: the SP metadata (served at a well-known URL so the IdP
  # can register us), the SP-initiated start (mints a signed AuthnRequest +
  # redirects the browser to the IdP), and the Assertion Consumer Service
  # (POST endpoint the IdP posts the signed assertion back to).

  /api/v1/auth/saml/metadata:
    get:
      tags: [auth]
      operationId: metadataSAML
      summary: SAML service-provider metadata
      description: |
        Serves the SP metadata XML the IdP registers Lahijan under. The
        metadata carries the SP's entity ID, the ACS URL (POST binding), and
        the SP's signing certificate so the IdP can verify signed
        AuthnRequests.

        When no SAML provider is configured, returns a 501 with a localised
        "feature disabled" envelope.
      security: []
      responses:
        "200":
          description: SP metadata XML.
          content:
            application/xml:
              schema:
                type: string
        "501":
          description: SAML is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/saml/{provider}/start:
    get:
      tags: [auth]
      operationId: startSAML
      summary: Begin a SAML 2.0 service-provider flow
      description: |
        Mints a signed SAML AuthnRequest, sets a signed CSRF state token as a
        short-lived cookie, and 302s the browser to the IdP's SSO endpoint
        (HTTP-Redirect binding).

        When called from an authenticated session (the user is linking a new
        SAML IdP to their existing account) the response also sets a
        lahijan_link_uid cookie carrying the user's id; the ACS enforces the
        link against the user who started the flow.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The configured SAML provider key (e.g. entra, okta).
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the IdP SSO URL.
          headers:
            Location:
              description: The absolute IdP SSO URL carrying SAMLRequest + RelayState.
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The provider key is not configured or not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/saml/{provider}/acs:
    post:
      tags: [auth]
      operationId: assertionConsumerServiceSAML
      summary: SAML Assertion Consumer Service
      description: |
        Consumes the IdP's POSTed SAML response (form fields SAMLResponse +
        RelayState), verifies the state token against the cookie nonce,
        verifies the signed assertion (signature via the IdP's published
        certificate, audience, recipient, conditions, InResponseTo replay
        check), and either:
          - logs the user in (sets the session + refresh cookies), or
          - links the SAML identity to the logged-in user (when
            lahijan_link_uid is set), or
          - returns a "completion required" envelope when the (provider,
            name_id) is unknown and just-in-time user creation is disabled.

        On success the browser is redirected to the dashboard root (`/`);
        on failure it is redirected to the login page with an error query.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: Base64-encoded SAML Response XML the IdP signed.
                RelayState:
                  type: string
                  description: The relay state the SP emitted on /start (carries the CSRF token).
      responses:
        "302":
          description: Redirect to the dashboard or login page.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/identities:
    get:
      tags: [auth]
      operationId: listMyIdentities
      summary: List the current user's linked external identities
      description: |
        Returns every external identity (OAuth + OIDC) linked to the current
        user. Tokens are NOT included; only the provider key, subject, and
        scopes are returned.
      responses:
        "200":
          description: The caller's linked identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/identities/{identityId}:
    delete:
      tags: [auth]
      operationId: deleteMyIdentity
      summary: Unlink an external identity from the current user
      description: |
        Removes the (user, provider) link. Refuses if removing it would leave
        the user with no way to log in (no password and no other identities).
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Removing this identity would leave the user with no way to log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Multi-factor authentication (WS-07c)
  # -------------------------------------------------------------------------
  # Self-service factor enrollment lives under /api/v1/me/mfa/*. The login
  # challenge endpoint is under /api/v1/auth/mfa/challenge because the caller
  # is anonymous (only carries the pending_session_token).

  /api/v1/me/mfa/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTOTP
      summary: Begin TOTP enrollment
      description: |
        Generates a fresh TOTP secret, AES-GCM-encrypts it at rest, and
        returns the raw secret + the otpauth:// provisioning URI for the
        dashboard to render as a QR code. Until the user confirms with a
        valid 6-digit code at /verify, the secret does NOT count as an
        enrolled factor (login does not challenge for it).

        Re-enrollment over a confirmed factor fails with 409 — the user
        must explicitly disable first.
      responses:
        "200":
          description: The new TOTP secret + provisioning URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: TOTP is already enrolled; disable first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/mfa/totp/verify:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Confirm TOTP enrollment with a 6-digit code
      description: |
        Marks the pending TOTP secret as confirmed (the user's
        authenticator app produced a matching 6-digit code). On success
        the factor becomes effective and a fresh batch of recovery codes
        is generated (returned once via /me/mfa/recovery).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPVerifyRequest"
      responses:
        "200":
          description: TOTP confirmed; recovery codes generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesBatch"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/totp/disable:
    post:
      tags: [auth]
      operationId: disableTOTP
      summary: Disable TOTP
      description: |
        Removes the user's TOTP factor. Per the WS-07c default the caller
        MUST supply their current password (re-authentication) before the
        factor is removed; this prevents a stolen session cookie from
        silently disarming MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: TOTP disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/register/begin:
    post:
      tags: [auth]
      operationId: beginWebAuthnRegistration
      summary: Begin WebAuthn / passkey registration
      description: |
        Returns the PublicKeyCredentialCreationOptions the browser feeds
        to navigator.credentials.create(). The dashboard persists the
        returned ceremony session (typically in a short-lived cookie or
        local storage) and POSTs it back at /register/finish.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnBeginRequest"
      responses:
        "200":
          description: The ceremony options + opaque session handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnBeginRegistrationResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: WebAuthn is not configured on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/mfa/webauthn/register/finish:
    post:
      tags: [auth]
      operationId: finishWebAuthnRegistration
      summary: Finish WebAuthn / passkey registration
      description: |
        Accepts the attestation response the browser POSTed after
        navigator.credentials.create() succeeded. Verifies the signature,
        persists the credential, and (on success) returns a small
        confirmation envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnFinishRegistrationRequest"
      responses:
        "200":
          description: The credential was registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/login/begin:
    post:
      tags: [auth]
      operationId: beginWebAuthnLogin
      summary: Begin a WebAuthn login ceremony
      description: |
        Returns the PublicKeyCredentialRequestOptions the browser feeds
        to navigator.credentials.get() during an MFA challenge. The
        caller MUST carry a valid pending_session_token (issued by the
        password/IdP login step when MFA is required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginBeginRequest"
      responses:
        "200":
          description: The ceremony options + opaque session handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnLoginBeginResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/login/finish:
    post:
      tags: [auth]
      operationId: finishWebAuthnLogin
      summary: Finish a WebAuthn login ceremony
      description: |
        Accepts the assertion response the browser POSTed after
        navigator.credentials.get() succeeded. On success the MFA
        challenge is complete; the caller still POSTs to
        /api/v1/auth/mfa/challenge with kind=webauthn-finished to
        exchange the pending_session_token for the real session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginFinishRequest"
      responses:
        "200":
          description: The assertion verified; the challenge is complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/credentials/{credentialId}:
    delete:
      tags: [auth]
      operationId: deleteWebAuthnCredential
      summary: Remove a WebAuthn credential
      description: |
        Revokes a single WebAuthn credential (one of the user's passkeys).
        Re-authentication (current password) is required when this would
        leave the user with zero factors AND MFA is required by policy.
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Credential removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/mfa/recovery:
    get:
      tags: [auth]
      operationId: listMyRecoveryCodes
      summary: List recovery code metadata (no raw codes)
      description: |
        Returns metadata about the user's recovery codes (count remaining,
        created_at per row). The raw codes are NEVER returned by this
        endpoint — they were shown exactly once at generation time.
      responses:
        "200":
          description: The user's recovery code rows (raw codes stripped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      operationId: regenerateMyRecoveryCodes
      summary: Regenerate the recovery code batch
      description: |
        Wipes the user's existing recovery codes (used + unused) and
        issues a fresh batch. The raw codes are returned exactly once;
        Lahijan cannot show them again.
      responses:
        "200":
          description: The fresh batch of recovery codes (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesBatch"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/mfa/challenge:
    post:
      tags: [auth]
      operationId: challengeMFA
      summary: Verify an MFA challenge and issue the real session
      description: |
        Accepts a pending_session_token (from /login or /oauth/callback
        when MFA was required) plus an MFA code:

          - kind=totp:     code is a 6-digit TOTP value
          - kind=recovery: code is a recovery code
          - kind=webauthn: assertion fields from the /webauthn/login/finish response

        On success the pending_session_token is consumed and the real
        session + refresh token are issued (set as cookies, just like
        /login). On failure the failed_attempts counter is bumped; at
        maxAttempts=5 the pending token is revoked (brute-force lockout).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeRequest"
      responses:
        "200":
          description: MFA succeeded; real session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            The pending token is invalid, expired, already used, or
            revoked; OR the supplied code did not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts; pending session revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -------------------------------------------------------------------------
  # Audit log (WS-08)
  # -------------------------------------------------------------------------
  # /api/v1/audit returns the tenant-scoped audit trail; the caller must be a
  # member of the tenant (set via X-Tenant-Id) and hold audit.read.
  # /api/v1/audit/global is the superuser variant (audit.read_global).

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: List audit events for the current tenant
      description: |
        Returns the tenant-scoped audit trail, filtered by the optional query
        parameters. The caller must be authenticated, supply a tenant scope
        via the X-Tenant-Id header, and hold the audit.read permission.

        System-level events (e.g. auth login) carry a NULL tenant_id and are
        visible from every tenant so operators can trace user flows end to
        end.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, failure, pending] }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, system, plugin] }
        - name: fromTs
          in: query
          schema: { type: string, format: date-time }
        - name: toTs
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/{auditId}:
    get:
      tags: [audit]
      operationId: getAudit
      summary: Fetch a single audit event by id
      description: |
        Returns the audit row plus its outcome trail (the latest outcome's
        status is the event's current status). System-level events (NULL
        tenant_id) are visible from any tenant.
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Export the tenant audit log (CSV or JSON)
      description: |
        Streams the matching audit rows as either CSV (the default) or JSON.
        Same filters as /audit but no pagination — the caller gets every
        matching row, chunked. Requires the audit.export permission; the
        export itself is recorded as an audit event (action: audit.export).
      parameters:
        - $ref: "#/components/parameters/ExportFormat"
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, failure, pending] }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, system, plugin] }
        - name: fromTs
          in: query
          schema: { type: string, format: date-time }
        - name: toTs
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The audit rows in the requested format.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------------------------
  # Admin: job system (WS-09). Platform-admin-only endpoints for inspecting
  # and controlling River's durable job queue. Every privileged action also
  # emits an audit event (action: platform.job.retry | platform.job.cancel).
  # River's built-in web UI is mounted at /admin/jobs/ui (NOT under /api/v1/
  # because it ships its own REST API); the same platform.jobs.read
  # permission gates both.
  # -------------------------------------------------------------------------

  /api/v1/admin/jobs:
    get:
      tags: [admin]
      operationId: listAdminJobs
      summary: List queued / running / failed jobs
      description: |
        Returns a filtered, paginated page of jobs from the durable job
        queue (River). The caller MUST hold the platform.jobs.read
        permission (i.e. be a platform.admin). Cross-tenant by design:
        jobs are global; the platform admin can see every tenant's work.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: state
          in: query
          description: |
            Filter by job state. When omitted, every state is returned.
            Multiple values are OR'd together.
          schema:
            type: array
            items:
              type: string
              enum: [available, pending, retryable, running, scheduled, completed, cancelled, discarded]
        - name: kind
          in: query
          description: Filter by exact job kind (e.g. "billing.usage.rollup").
          schema:
            type: string
        - name: queue
          in: query
          description: Filter by queue name.
          schema:
            type: string
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/jobs/{jobId}:
    get:
      tags: [admin]
      operationId: getAdminJob
      summary: Fetch a single job by id
      description: |
        Returns the full job row (state, args, attempt history, errors) for
        the given id. Requires platform.jobs.read.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The River job id (a bigserial, not a UUID).
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The job row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/jobs/{jobId}/retry:
    post:
      tags: [admin]
      operationId: retryAdminJob
      summary: Manually retry a discarded (DLQ'd) job
      description: |
        Re-queues a discarded job for an immediate retry. Requires the
        platform.jobs.retry permission. The action is recorded as an audit
        event (action: platform.job.retry).
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The job was re-queued; the updated row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The job is not in a retryable state (e.g. still running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [admin]
      operationId: cancelAdminJob
      summary: Cancel a queued or running job
      description: |
        Marks the job as cancelled. Already-running jobs get a cancellation
        signal via context. Requires the platform.jobs.cancel permission.
        The action is recorded as an audit event (action:
        platform.job.cancel).
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The job was cancelled; the updated row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The job is already in a terminal state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -------------------------------------------------------------------------
  # Admin: plugin system (WS-10a). Platform-admin-only endpoints for
  # uploading, listing, inspecting, granting, enabling, disabling, and
  # deleting WASM plugins. Every state-changing action emits an audit event
  # (action: plugins.upload | plugins.grant | plugins.revoke | plugins.enable
  # | plugins.disable | plugins.delete). The runtime itself (instantiation)
  # is gated behind conf.wasm.enabled; when the runtime is disabled these
  # endpoints still work (the plugin row is persisted in "pending") and the
  # runtime will compile on first instantiation after the operator turns
  # wasm.enabled on.
  # -------------------------------------------------------------------------

  /api/v1/admin/plugins:
    get:
      tags: [admin]
      operationId: listAdminPlugins
      summary: List installed plugins
      description: |
        Returns a paginated list of plugins visible to the caller. A
        platform.admin sees every plugin across every tenant; a tenant
        admin sees their tenant's plugins plus every platform-wide plugin
        (tenant_id IS NULL).
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of plugins.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPluginPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/plugins/upload:
    post:
      tags: [admin]
      operationId: uploadAdminPlugin
      summary: Upload a new plugin (.wasm + manifest)
      description: |
        Accepts multipart/form-data with two parts:

          * `wasm`     — the compiled .wasm bytes (binary).
          * `manifest` — the lahijan.manifest.yaml text.

        The server parses + validates the manifest, compiles the wasm bytes
        under the configured memory cap (rejecting modules that declare more
        memory than `wasm.max_memory_per_plugin`), persists a new plugin row
        in "pending" status, and emits an audit event. The plugin is NOT
        active after upload; the admin must grant at least one permission
        (or call /enable directly when no permissions are needed) before
        the runtime will instantiate it.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [wasm, manifest]
              properties:
                wasm:
                  type: string
                  format: binary
                manifest:
                  type: string
      responses:
        "201":
          description: The plugin was uploaded; the new row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlugin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: A plugin with this (name, version) already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: The .wasm module exceeds the configured max upload size.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/plugins/{pluginId}:
    get:
      tags: [admin]
      operationId: getAdminPlugin
      summary: Fetch a single plugin by id
      description: |
        Returns the full plugin row including the parsed manifest and the
        list of granted permissions. The wasm bytes are NOT included (they
        can be very large); a separate download endpoint will land in a
        follow-up WS if needed.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The plugin row + grants.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlugin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [admin]
      operationId: deleteAdminPlugin
      summary: Delete a plugin
      description: |
        Hard-deletes the plugin row and its grants (CASCADE). Active
        instances are cancelled at the next host-call boundary. Emits an
        audit event (action: plugins.delete).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/plugins/{pluginId}/permissions/{permission}/{action}:
    post:
      tags: [admin]
      operationId: setAdminPluginPermission
      summary: Grant or revoke a single permission on a plugin
      description: |
        {action} is one of `grant` | `revoke`. The {permission} path
        segment is the slug (e.g. `kv.read:cache`); URL-encode the `:`
        separator as `%3A` if your client does not do so automatically.
        Grants are idempotent; revokes are no-ops when the slug is not
        held. Every call emits an audit event (action: plugins.grant |
        plugins.revoke) carrying the permission slug in metadata.
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: permission
          in: path
          required: true
          schema: { type: string }
          description: The permission slug (e.g. "kv.read:cache").
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [grant, revoke] }
      responses:
        "200":
          description: The grant/revoke was applied; the updated grant list is returned.
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/plugins/{pluginId}/enable:
    post:
      tags: [admin]
      operationId: enableAdminPlugin
      summary: Enable a plugin
      description: |
        Flips the plugin's status from "pending" or "disabled" to "active".
        The runtime may now instantiate it on demand. Emits an audit event
        (action: plugins.enable).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The plugin was enabled; the updated row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlugin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/plugins/{pluginId}/disable:
    post:
      tags: [admin]
      operationId: disableAdminPlugin
      summary: Disable a plugin
      description: |
        Flips the plugin's status to "disabled". Grants persist; calling
        /enable picks them back up. Emits an audit event (action:
        plugins.disable).
      parameters:
        - name: pluginId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The plugin was disabled; the updated row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlugin" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  # -------------------------------------------------------------------------
  # Admin: plugin marketplace (WS-10c). Platform-admin-only endpoints for
  # browsing the configured marketplace index and installing or upgrading
  # plugins from it. Every state-changing action emits an audit event
  # (action: plugins.marketplace_install | plugins.marketplace_upgrade |
  # plugins.upgrade). The marketplace source is configured via
  # wasm.marketplace.url (HTTP) or wasm.marketplace.path (local directory).
  # -------------------------------------------------------------------------

  /api/v1/admin/marketplace:
    get:
      tags: [admin]
      operationId: listAdminMarketplace
      summary: List plugins available in the marketplace
      description: |
        Returns the configured marketplace index verbatim. Each entry
        carries the plugin's marketplace metadata (name, version,
        description, license, permissions) plus the sha256 pin the
        installer verifies before persisting. The marketplace itself
        is configured via conf.wasm.marketplace.{url,path}.
      responses:
        "200":
          description: A page of marketplace entries.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMarketplacePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501":
          description: The marketplace subsystem is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/marketplace/{name}:
    get:
      tags: [admin]
      operationId: getAdminMarketplaceEntry
      summary: Fetch a single marketplace entry by name
      description: |
        Returns one entry from the marketplace index. Useful for the
        admin UI's "install" page which renders the manifest + permission
        list before the admin approves.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: The marketplace entry name (kebab-case).
      responses:
        "200":
          description: The entry.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminMarketplaceEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501":
          description: The marketplace subsystem is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/plugins/install/{name}:
    post:
      tags: [admin]
      operationId: installAdminPluginFromMarketplace
      summary: Install a plugin from the marketplace
      description: |
        Fetches the plugin from the configured marketplace (verifying
        the sha256 pin), runs it through the standard installer.Upload
        flow (audit emission, permission enforcement), and returns the
        new plugin row in "pending" status. The admin must grant at
        least one permission (or call /enable directly) before the
        runtime will instantiate it.

        Returns 409 Conflict when a plugin with this (name, *) already
        exists; the admin should POST /upgrade/{name} instead.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: The marketplace entry name (kebab-case).
      responses:
        "201":
          description: The plugin was installed; the new row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPlugin" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The marketplace has no entry with this name.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: A plugin with this name is already installed (use /upgrade instead).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The downloaded .wasm does not match the marketplace sha256 pin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: The marketplace subsystem is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/plugins/upgrade/{name}:
    post:
      tags: [admin]
      operationId: upgradeAdminPluginFromMarketplace
      summary: Upgrade an installed plugin to the marketplace's latest version
      description: |
        Fetches the marketplace version of an already-installed plugin
        and runs it through installer.Upgrade. The flow:

          1. Locates the most recent prior version (by name).
          2. Semver-compares; rejects downgrades + same-version
             reinstalls.
          3. Uploads the new version (status=pending), preserving
             grants the new manifest still requests, dropping grants
             it no longer requests, and surfacing new permissions in
             the response so the admin can approve them.
          4. Hard-deletes the old row. CASCADE removes orphan state.

        The response includes `newPermissions` — the admin must POST
        /permissions/{perm}/grant for each before /enable will work.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
          description: The marketplace entry name (kebab-case).
      responses:
        "200":
          description: The upgrade completed; the result bundle is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminPluginUpgradeResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404":
          description: The marketplace has no entry with this name OR no prior installation exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The marketplace version equals the installed version.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: The downloaded .wasm does not match the marketplace sha256 pin.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: The marketplace subsystem is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # ===========================================================================
  # Compute module (WS-14)
  # ===========================================================================

  /api/v1/compute/instances:
    get:
      tags: [compute]
      operationId: listComputeInstances
      summary: List compute instances
      description: |
        Returns a paginated list of the caller's compute instances within
        the tenant in scope. The list reflects the cached state in the
        Lahijan database; live state from the daemon is queried on demand
        via GET /instances/{id} (which reconciles) or via the per-instance
        reconcile endpoint (TODO).
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of instances.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeInstancePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [compute]
      operationId: createComputeInstance
      summary: Create a compute instance
      description: |
        Creates a new instance in the caller's tenant. The service checks
        the per-tenant quota (vCPU / RAM / disk / instance count) before
        reaching the daemon; an over-quota request returns 422. The
        instance is created in "stopped" state; the caller must POST
        /instances/{id}/start to launch it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputeInstanceCreateRequest" }
      responses:
        "201":
          description: Instance created (in stopped state).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "402":
          description: Insufficient balance to create the instance (per ADR-0013).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422":
          description: Quota exceeded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501":
          description: The compute subsystem is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/compute/instances/{instanceId}:
    get:
      tags: [compute]
      operationId: getComputeInstance
      summary: Get a compute instance (reconciled)
      description: |
        Returns the instance, reconciling the cached row with the live
        daemon state. A flaky daemon returns the cached state instead of
        erroring so the UI does not 500 on a backend blip.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeInstance" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [compute]
      operationId: updateComputeInstance
      summary: Update an instance's config
      description: |
        Replaces the instance's description, config, devices, and profiles.
        Hot-pluggable fields (e.g. limits.memory for a stopped instance)
        apply immediately; others require a restart.
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputeInstanceUpdateRequest" }
      responses:
        "200":
          description: The updated instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [compute]
      operationId: deleteComputeInstance
      summary: Delete a compute instance
      description: |
        Stops the instance if running (force = true skips the graceful
        shutdown), deletes it from the daemon, and soft-deletes the
        cached row (the row is retained for historical audit + billing
        joins).
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: force
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: Skip the graceful shutdown and force-delete.
      responses:
        "204": { description: Instance deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/compute/instances/{instanceId}/{action}:
    parameters:
      - name: instanceId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [start, stop, restart, freeze, unfreeze] }
      - name: force
        in: query
        required: false
        schema: { type: boolean, default: false }
        description: Force the action (skip graceful shutdown for stop).
      - name: timeout
        in: query
        required: false
        schema: { type: integer, minimum: 0, default: 30 }
        description: Action timeout in seconds.
    post:
      tags: [compute]
      operationId: setComputeInstanceState
      summary: Apply a lifecycle action to an instance
      description: |
        Starts, stops, restarts, freezes, or unfreezes an instance. The
        cached row is updated with the new status; the audit log records
        the action and the WASM event bus emits the corresponding
        compute.instance.* event.
      responses:
        "200":
          description: The updated instance.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeInstance" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The action conflicts with the current state (e.g. start on a running instance).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/compute/instances/{instanceId}/exec:
    post:
      tags: [compute]
      operationId: execComputeInstance
      summary: Run a one-shot command inside an instance
      description: |
        Runs the given command in the instance and returns the captured
        stdout, stderr, and exit code. The interactive (bidirectional,
        xterm.js) variant lands with WS-20 (dashboard UI); this endpoint
        is the simpler "run + capture" path the API exposes today. The
        instance must be running (WS-14 open question 3).
      parameters:
        - name: instanceId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputeExecRequest" }
      responses:
        "200":
          description: The captured output.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeExecResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The instance is not running.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/compute/images:
    get:
      tags: [compute]
      operationId: listComputeImages
      summary: List compute images
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of images.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeImagePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [compute]
      operationId: uploadComputeImage
      summary: Record a custom image
      description: |
        Records a custom image row in the tenant's catalog. The actual
        upload to the image store is performed by the provider driver;
        this endpoint persists the alias + fingerprint so the catalog is
        listable and the alias resolves at instance-create time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComputeImageUploadRequest" }
      responses:
        "201":
          description: Image recorded.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeImage" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }

  /api/v1/compute/images/{imageId}:
    parameters:
      - name: imageId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [compute]
      operationId: getComputeImage
      summary: Get an image
      responses:
        "200":
          description: The image.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComputeImage" }
