  # ===========================================================================
  # DNS module (WS-15)
  # ===========================================================================

  /api/v1/dns/zones:
    get:
      tags: [dns]
      operationId: listDNSZones
      summary: List DNS zones
      description: |
        Returns a paginated list of the caller's DNS zones within the tenant
        in scope. The list reflects the cached state in the Lahijan DB; a
        per-zone Reconcile call refreshes the DNSSEC flag from PDNS on
        demand.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of zones.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZonePage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      tags: [dns]
      operationId: createDNSZone
      summary: Create a DNS zone
      description: |
        Creates a new zone in the caller's tenant. The canonical name must
        be globally unique (per WS-15 Open Question 3: per-tenant
        uniqueness at the API, but two tenants cannot own the same
        canonical id because the canonical_id column is globally unique).
        The PowerDNS daemon is asked to bootstrap the zone with the
        configured default nameservers; DNSSEC is off by default per
        WS-12 Open Question 1.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSZoneCreateRequest" }
      responses:
        "201":
          description: Zone created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409":
          description: Zone already exists (canonical id claimed by another tenant).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/dns/zones/{zoneId}:
    get:
      tags: [dns]
      operationId: getDNSZone
      summary: Get a DNS zone (reconciled)
      description: |
        Returns the zone, reconciling the cached DNSSEC flag with the live
        PDNS state. A flaky daemon returns the cached state instead of
        erroring so the UI does not 500 on a backend blip.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZone" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    patch:
      tags: [dns]
      operationId: updateDNSZone
      summary: Update a DNS zone's settings
      description: |
        Replaces the zone's description and/or kind. The kind change also
        propagates to PowerDNS so the daemon's view matches.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSZoneUpdateRequest" }
      responses:
        "200":
          description: The updated zone.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSZone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      tags: [dns]
      operationId: deleteDNSZone
      summary: Delete a DNS zone
      description: |
        Removes the zone from PowerDNS, drops every owned dns_records row,
        and removes the dns_zones row. Idempotent on the daemon side: if
        PDNS reports 404 we still proceed so the dns_zones row is removed.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Zone deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/dns/zones/{zoneId}/records:
    get:
      tags: [dns]
      operationId: listDNSRecords
      summary: List DNS records in a zone
      description: |
        Returns a paginated list of the records in the zone. The cache is
        returned; reconciliation is implicit on every read because the
        dns_records table is the source of truth on the Lahijan side.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
      responses:
        "200":
          description: A page of records.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecordPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    post:
      tags: [dns]
      operationId: createDNSRecord
      summary: Create a DNS record
      description: |
        Creates a new record in the zone. The content is validated per
        type before being submitted to PowerDNS; a malformed content
        returns 400 with a per-type message. CNAME at the zone apex is
        rejected per WS-15 Open Question 2 (strict RFC).
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordCreateRequest" }
      responses:
        "201":
          description: Record created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: A record with the same (name, type, content) already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/dns/zones/{zoneId}/records/{recordId}:
    get:
      tags: [dns]
      operationId: getDNSRecord
      summary: Get a DNS record
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    patch:
      tags: [dns]
      operationId: updateDNSRecord
      summary: Update a DNS record
      description: |
        Replaces the record's content / TTL / disabled flag. The name and
        type are immutable — callers wanting a rename issue a delete +
        create so the audit trail stays honest.
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DNSRecordUpdateRequest" }
      responses:
        "200":
          description: The updated record.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DNSRecord" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }
    delete:
      tags: [dns]
      operationId: deleteDNSRecord
      summary: Delete a DNS record
      parameters:
        - name: zoneId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: recordId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Record deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/dns/zones/{zoneId}/dnssec/{action}:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: action
        in: path
        required: true
        schema: { type: string, enum: [enable, disable] }
    post:
      tags: [dns]
      operationId: setDNSZoneDNSSEC
      summary: Enable or disable DNSSEC for a zone
      description: |
        Turns DNSSEC on or off for the zone. Enable creates a combined
        signing key (CSK) via PowerDNS; disable removes every cryptokey.
        Both are idempotent: a double-click is safe.
      responses:
        "204": { description: DNSSEC toggle applied. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

  /api/v1/dns/templates:
    get:
      tags: [dns]
      operationId: listDNSTemplates
      summary: List built-in zone templates
      description: |
        Returns the read-only catalog of predefined zone templates
        (Google Workspace setup, Microsoft 365 setup, Google Search
        Console verification, ...). Templates are pure data; apply via
        POST /zones/{id}/apply-template.
      responses:
        "200":
          description: The template catalog.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/DNSTemplate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/dns/zones/{zoneId}/apply-template:
    parameters:
      - name: zoneId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [dns]
      operationId: applyDNSTemplate
      summary: Apply a predefined template to a zone
      description: |
        Upserts every record the template defines into the zone. Idempotent:
        running the same template twice updates the records (REPLACE
        semantics) rather than duplicating them.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ApplyDNSTemplateRequest" }
      responses:
        "200":
          description: Template applied. Returns the count of records upserted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ApplyDNSTemplateResult" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "501": { $ref: "#/components/responses/NotImplemented" }

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # Standard headers reused across auth responses.
  headers:
    SetCookie:
      description: |
        An HTTP-only cookie carrying either the session id or the refresh
        token. Lahijan sets both on register/login/refresh and clears them on
        logout.
      schema:
        type: string
        examples: ["lahijan_session=...; HttpOnly; SameSite=Lax"]

  # Reusable query parameters.
  parameters:
    PageLimit:
      name: limit
      in: query
      description: Maximum number of items to return (1..200).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageOffset:
      name: offset
      in: query
      description: Number of items to skip for pagination.
      schema: { type: integer, minimum: 0, default: 0 }
    ExportFormat:
      name: format
      in: query
      description: Output format for the export. Defaults to csv.
      schema: { type: string, enum: [csv, json], default: csv }

  # Standard error responses reused across the API.
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: bad_request
              message: "request body failed validation"
              details:
                field: email
    Unauthorized:
      description: Authentication is required or has failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: "authentication required"
    Forbidden:
      description: The caller is not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: "permission denied"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: "resource not found"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: "an account with this email already exists"
    NotImplemented:
      description: The endpoint exists but is not implemented yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_implemented
              message: "not implemented yet"
    InternalError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal
              message: "internal server error"

  schemas:
    # The standard error envelope. Every error response in the API is shaped
    # exactly like this: { error: { code, message, details? } }.
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Machine-readable error code (snake_case).
              examples: [bad_request, unauthorized, forbidden, not_found, internal]
            message:
              type: string
              description: Human-readable error message, safe to show users.
            details:
              description: |
                Optional structured details about the error (e.g. per-field
                validation errors). Free-form object; consumers must not assume
                a fixed schema.
              type: object
              additionalProperties: true

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Coarse service health.
        version:
          type: string
          description: Build version of the running binary.

    Pong:
      type: object
      required: [pong]
      additionalProperties: false
      properties:
        pong:
          type: string
          description: RFC 3339 timestamp at which the server handled the request.
          format: date-time
          examples: ["2026-07-17T12:00:00Z"]

    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique user id.
        email:
          type: string
          format: email
          description: Unique user email.
        displayName:
          type: string
          description: Optional human-friendly display name.
          nullable: true
        memberships:
          type: array
          description: Tenant memberships held by this user.
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      required: [tenantId, role]
      additionalProperties: false
      properties:
        tenantId:
          type: string
          format: uuid
        role:
          type: string
          description: Role held within the tenant (e.g. owner, admin, member).

    # ---------------------------------------------------------------------
    # Auth request/response schemas (WS-06).
    # ---------------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Plaintext password; hashed with argon2id before storage.
        displayName:
          type: string
          nullable: true
        locale:
          type: string
          description: Preferred locale code (en, fa). Defaults to en.
          default: en

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LogoutRequest:
      type: object
      additionalProperties: false
      description: |
        Optional. When omitted, the refresh-token cookie is used. Pass an
        explicit refresh token when logging out a non-browser client.
      properties:
        refreshToken:
          type: string

    RefreshRequest:
      type: object
      additionalProperties: false
      description: |
        Optional. When omitted, the refresh-token cookie is used. Pass an
        explicit refresh token when rotating from a non-browser client.
      properties:
        refreshToken:
          type: string

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use signed token from an email link.

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          nullable: true
        locale:
          type: string
        currentPassword:
          type: string
          format: password
          description: Required when changing the password.
        newPassword:
          type: string
          format: password
          description: When set, currentPassword must also be present.
        newEmail:
          type: string
          format: email
          description: |
            Triggers an email-change confirmation link; the email is not swapped
            until the link is consumed.

    AuthResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"

    MFAChallengeRequired:
      type: object
      required: [pendingSessionToken, mfaRequired]
      additionalProperties: false
      properties:
        mfaRequired:
          type: boolean
          description: Always true; signals the 202 path.
        pendingSessionToken:
          type: string
          description: |
            Short-lived, single-use token. POST it to
            /api/v1/auth/mfa/challenge with the MFA code to obtain the
            real session cookies.
        enrolledFactors:
          type: array
          description: |
            The factors the user has enrolled. Lets the dashboard pick
            the default challenge UI (TOTP input vs WebAuthn prompt).
          items:
            type: string
            enum: [totp, webauthn]

    CreatePersonalAccessTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        scopes:
          type: array
          description: Permission slugs (scope.action) the PAT grants.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    PersonalAccessToken:
      type: object
      required: [id, name, scopes, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        token:
          type: string
          description: The raw PAT. Present ONLY on create; never returned again.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: Localized human-readable confirmation.

    # External identity (WS-07a + WS-07b): a link between a user and an
    # OAuth/OIDC/SAML IdP. Tokens are NOT included; only the provider key,
    # the IdP-stable subject, and the scopes the IdP granted at issue/refresh
    # time. For SAML identities the scopes array is empty and the optional
    # attributes map carries the snapshot from the most recent assertion.
    ExternalIdentity:
      type: object
      required: [id, provider, subject, scopes, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The identity row id.
        provider:
          type: string
          description: |
            The provider key: a configured OAuth preset (google, github),
            "oidc:<config_key>" for an OIDC IdP, or "saml:<config_key>" for
            a SAML 2.0 IdP.
        subject:
          type: string
          description: |
            The IdP-stable subject identifier. For OAuth/OIDC this is the
            `sub` claim; for SAML it is the NameID.
        scopes:
          type: array
          description: |
            Scope strings the IdP granted at issue/refresh time. Empty for
            SAML identities (SAML has no notion of scopes).
          items:
            type: string
        attributes:
          type: object
          description: |
            SAML-only: snapshot of the attribute statement from the most
            recent assertion. Each key is a SAML attribute name (typically a
            URI like http://schemas.xmlsoap.org/ws/2005/05/identity/claims/
            emailaddress); each value is an array of strings (SAML attributes
            are multi-valued). NULL/absent for OAuth/OIDC identities.
          additionalProperties:
            type: array
            items:
              type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the access_token expires; NULL when non-expiring or for
            SAML identities (SAML assertions are short-lived and not stored).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------------
    # Audit schemas (WS-08).
    # ---------------------------------------------------------------------

    AuditEvent:
      type: object
      required: [id, action, resourceType, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The audit row id.
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: NULL for system-level events (e.g. login).
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: NULL when the actor is the system.
        actorType:
          type: string
          enum: [user, system, plugin]
        action:
          type: string
          description: |
            The privileged action slug, formatted scope.action
            (e.g. compute.instance.create). The localised label can be
            rendered via audit.action_<slug> i18n keys.
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [success, failure, pending]
          description: |
            The current status. When the event has outcome rows, this is the
            latest outcome's status; otherwise it is the row's initial status.
        requestId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: Free-form structured details recorded at emit time.
        createdAt:
          type: string
          format: date-time
        outcomes:
          type: array
          description: The outcome trail, newest first. Empty when Emit was fire-and-forget.
          items:
            $ref: "#/components/schemas/AuditOutcome"

    AuditOutcome:
      type: object
      required: [id, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [success, failure, pending]
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AuditPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total:
          type: integer
          format: int64
          description: Total events matching the filter (for pagination UI).
        limit:
          type: integer
        offset:
          type: integer

    # ---------------------------------------------------------------------
    # Admin job schemas (WS-09). Mirror River's river_job row shape, with a
    # few omissions (unique_key, unique_states) the admin UI doesn't need.
    # ---------------------------------------------------------------------

    AdminJob:
      type: object
      required: [id, kind, state, queue, priority, attempt, maxAttempts, createdAt, scheduledAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: The River job id (bigserial).
        kind:
          type: string
          description: The stable "scope.action" job kind.
        state:
          type: string
          enum: [available, pending, retryable, running, scheduled, completed, cancelled, discarded]
        queue:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 4
        attempt:
          type: integer
          description: The current attempt number (0 before the first run).
        maxAttempts:
          type: integer
        args:
          type: object
          additionalProperties: true
          description: The decoded job payload (JobArgs).
        attemptedBy:
          type: array
          items:
            type: string
        errors:
          type: array
          description: Per-attempt error trail, earliest first.
          items:
            $ref: "#/components/schemas/AdminJobError"
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        scheduledAt:
          type: string
          format: date-time
        attemptedAt:
          type: string
          format: date-time
          nullable: true
        finalizedAt:
          type: string
          format: date-time
          nullable: true

    AdminJobError:
      type: object
      required: [attempt, at, message]
      additionalProperties: false
      properties:
        attempt:
          type: integer
        at:
          type: string
          format: date-time
        message:
          type: string

    AdminJobPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminJob" }
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    # ---------------------------------------------------------------------
    # Admin plugin schemas (WS-10a). The plugin row + grant shape used by
    # the /api/v1/admin/plugins/* endpoints. The wasm bytes are NOT exposed
    # — the admin UI shows the hash; downloads land in a follow-up WS if
    # needed. The manifest is round-tripped verbatim (parsed YAML -> JSON)
    # so the UI can render exactly what the plugin declared at upload time.
    # ---------------------------------------------------------------------

    AdminPlugin:
      type: object
      required: [id, name, version, status, wasmHash, wasmSize, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: NULL for platform-wide plugins.
        name:
          type: string
        version:
          type: string
        description:
          type: string
        wasmHash:
          type: string
          description: sha256 hex of wasmBytes; surfaced in the admin UI.
        wasmSize:
          type: integer
          format: int64
          description: Size of the stored .wasm bytes.
        manifest:
          type: object
          additionalProperties: true
          description: |
            The parsed lahijan.manifest.yaml kept verbatim. Shape documented
            in internal/app/lahijan/wasm/manifest/manifest.go.
        permissions:
          type: array
          description: Granted permission slugs (admin-approved at install).
          items:
            type: string
        status:
          type: string
          enum: [pending, active, disabled]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AdminPluginPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminPlugin" }
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    # ---------------------------------------------------------------------
    # Marketplace schemas (WS-10c). The marketplace index shape used by
    # /api/v1/admin/marketplace* + the upgrade-result bundle returned by
    # /api/v1/admin/plugins/upgrade/{name}.
    # ---------------------------------------------------------------------

    AdminMarketplaceEntry:
      type: object
      required: [name, version, source, sha256]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Kebab-case plugin name (matches the manifest).
        version:
          type: string
          description: Semver version (matches the manifest).
        description:
          type: string
        author:
          type: string
        license:
          type: string
          description: SPDX identifier (Apache-2.0, MIT, ...).
        homepage:
          type: string
          format: uri
        permissions:
          type: array
          description: |
            Permission slugs the plugin requests. The admin must grant
            each one at install time; the upload parser rejects unknown
            slugs.
          items:
            type: string
        source:
          type: object
          required: [repo]
          additionalProperties: false
          properties:
            repo:
              type: string
              enum: [local, git]
              description: |
                `local` = the .wasm + manifest live under the marketplace
                root; `git` = clone the pinned git URL (future WS;
                signature verification required).
            path:
              type: string
              description: Subdirectory under the marketplace root (repo=local).
            gitURL:
              type: string
              format: uri
            gitRef:
              type: string
              description: Pinned git ref (branch, tag, or commit).
        sha256:
          type: string
          description: sha256 hex of the .wasm bytes; the installer verifies the download matches.

    AdminMarketplacePage:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminMarketplaceEntry" }

    AdminPluginUpgradeResult:
      type: object
      required: [plugin, oldId, preservedGrants, droppedGrants, newPermissions]
      additionalProperties: false
      description: |
        The result bundle returned by the marketplace upgrade endpoint.
        The admin uses `newPermissions` to decide whether to grant each
        one (per WS-10c DoD "upgrade adds a permission -> admin is
        prompted to grant it"). `droppedGrants` are surfaced for
        visibility but cannot be undone — the new manifest no longer
        requests them.
      properties:
        plugin:
          description: The newly-installed plugin row (status=pending).
          allOf:
            - $ref: "#/components/schemas/AdminPlugin"
        oldId:
          type: string
          format: uuid
          description: The id of the previous plugin row (now hard-deleted).
        preservedGrants:
          type: array
          description: Grants carried forward from the prior version.
          items:
            type: string
        droppedGrants:
          type: array
          description: Grants no longer requested by the new manifest (silently dropped).
          items:
            type: string
        newPermissions:
          type: array
          description: |
            New manifest permissions the prior version did not have. The
            admin MUST grant each one (POST
            /api/v1/admin/plugins/{pluginId}/permissions/{perm}/grant)
            before calling /enable.
          items:
            type: string

    # ---------------------------------------------------------------------
    # MFA schemas (WS-07c)
    # ---------------------------------------------------------------------

    TOTPEnrollResponse:
      type: object
      required: [secret, provisioningUri]
      additionalProperties: false
      properties:
        secret:
          type: string
          description: |
            The raw base32 TOTP secret, shown ONCE so the user can enter
            it manually if they cannot scan the QR. Persisted encrypted
            at rest.
        provisioningUri:
          type: string
          description: |
            The otpauth:// URL the dashboard encodes as a QR code.

    TOTPVerifyRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The 6-digit code from the user's authenticator app.

    MFADisableRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          description: |
            The user's current password. Required so that a stolen
            session cookie cannot silently disarm MFA.

    RecoveryCodesBatch:
      type: object
      required: [codes]
      additionalProperties: false
      properties:
        codes:
          type: array
          description: |
            The raw recovery codes. Shown to the user EXACTLY ONCE;
            Lahijan cannot render them again.
          items:
            type: string

    RecoveryCodesListResponse:
      type: object
      required: [total, remaining]
      additionalProperties: false
      properties:
        total:
          type: integer
          description: Total codes the user has (used + unused).
        remaining:
          type: integer
          description: Number of unused codes remaining.
        rows:
          type: array
          description: Optional per-row metadata (no raw codes).
          items:
            type: object
            required: [id, used, createdAt]
            properties:
              id:
                type: string
                format: uuid
              used:
                type: boolean
              createdAt:
                type: string
                format: date-time

    WebAuthnBeginRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Optional user-supplied label for the credential.

    WebAuthnBeginRegistrationResponse:
      type: object
      required: [publicKey, session]
      additionalProperties: false
      properties:
        publicKey:
          type: object
          description: |
            The PublicKeyCredentialCreationOptions the browser feeds to
            navigator.credentials.create(). Opaque to Lahijan.
        session:
          type: string
          description: |
            Opaque ceremony session token the dashboard MUST echo back
            at /finish in the matching field.

    WebAuthnFinishRegistrationRequest:
      type: object
      required: [session, response, name]
      additionalProperties: false
      properties:
        session:
          type: string
          description: The ceremony session returned by /register/begin.
        response:
          description: |
            The raw attestation response the browser POSTed. Carried
            verbatim to the WebAuthn library.
        name:
          type: string
          description: User-supplied label for the credential.

    WebAuthnLoginBeginRequest:
      type: object
      required: [pendingSessionToken]
      additionalProperties: false
      properties:
        pendingSessionToken:
          type: string
          description: The pending_session_token from /login or /oauth/callback.

    WebAuthnLoginBeginResponse:
      type: object
      required: [publicKey, session]
      additionalProperties: false
      properties:
        publicKey:
          type: object
          description: |
            The PublicKeyCredentialRequestOptions the browser feeds to
            navigator.credentials.get().
        session:
          type: string
          description: Opaque ceremony session for /login/finish.

    WebAuthnLoginFinishRequest:
      type: object
      required: [session, response]
      additionalProperties: false
      properties:
        session:
          type: string
        response:
          description: The raw assertion response from the browser.

    MFAChallengeRequest:
      type: object
      required: [pendingSessionToken, kind]
      additionalProperties: false
      properties:
        pendingSessionToken:
          type: string
          description: The token from /login when MFA is required.
        kind:
          type: string
          enum: [totp, recovery, webauthn]
          description: Which factor the user is challenging with.
        code:
          type: string
          description: |
            The 6-digit TOTP code (kind=totp) or the recovery code
            (kind=recovery). Empty when kind=webauthn.
        webauthnSession:
          type: string
          description: |
            The ceremony session from /me/mfa/webauthn/login/begin
            (kind=webauthn only).
        webauthnResponse:
          description: |
            The parsed assertion response from the browser
            (kind=webauthn only).

    # =========================================================================
    # Compute module schemas (WS-14)
    # =========================================================================

    ComputeInstance:
      type: object
      required: [id, tenantId, name, status, imageAlias, createdAt]
      additionalProperties: false
      properties:
        id:           { type: string, format: uuid }
        tenantId:     { type: string, format: uuid }
        name:         { type: string }
        type:
          type: string
          enum: [container, virtual-machine]
          description: Instance type. Defaults to container.
        status:
          type: string
          description: Cached Incus status string (Running, Stopped, Frozen, ...).
        statusCode:
          type: integer
          description: Numeric Incus status code (Running=103, Stopped=102).
        imageAlias:   { type: string }
        imageFingerprint:
          type: string
          description: Resolved image fingerprint (filled in at create success).
        profiles:
          type: array
          items: { type: string }
          description: Profile names applied to the instance.
        config:
          type: object
          additionalProperties: { type: string }
          description: Free-form config map (limits.cpu, limits.memory, ...).
        devices:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
          description: Per-device config map (root disk, nics, ...).
        description:  { type: string }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time }

    ComputeInstancePage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComputeInstance" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    ComputeInstanceCreateRequest:
      type: object
      required: [name, imageAlias]
      additionalProperties: false
      properties:
        name:        { type: string, minLength: 1, maxLength: 63 }
        type:
          type: string
          enum: [container, virtual-machine]
          default: container
        imageAlias:  { type: string, minLength: 1 }
        description: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        devices:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        profiles:
          type: array
          items: { type: string }
          default: ["default"]

    ComputeInstanceUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        description: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        devices:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        profiles:
          type: array
          items: { type: string }

    ComputeExecRequest:
      type: object
      required: [command]
      additionalProperties: false
      properties:
        command:
          type: array
          items: { type: string }
          description: The argv to execute. Must be non-empty.
        environment:
          type: object
          additionalProperties: { type: string }
        user:  { type: integer, default: 0 }
        group: { type: integer, default: 0 }
        cwd:   { type: string }
        stdin:
          type: string
          description: Input bytes for the process stdin (UTF-8 text).

    ComputeExecResult:
      type: object
      required: [exitCode]
      additionalProperties: false
      properties:
        stdout:
          type: string
          description: Captured stdout (base64 if non-UTF-8).
        stderr:
          type: string
          description: Captured stderr (base64 if non-UTF-8).
        exitCode: { type: integer }

    ComputeImage:
      type: object
      required: [id, alias, source]
      additionalProperties: false
      properties:
        id:           { type: string, format: uuid }
        alias:        { type: string }
        source:
          type: string
          enum: [featured, custom]
        fingerprint:  { type: string }
        type:
          type: string
          enum: [container, virtual-machine]
        architecture: { type: string }
        sizeBytes:    { type: integer, format: int64 }
        description:  { type: string }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time }

    ComputeImagePage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComputeImage" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    ComputeImageUploadRequest:
      type: object
      required: [alias, fingerprint]
      additionalProperties: false
      properties:
        alias:        { type: string, minLength: 1, maxLength: 63 }
        fingerprint:  { type: string, minLength: 1 }
        type:
          type: string
          enum: [container, virtual-machine]
          default: container
        architecture: { type: string }
        sizeBytes:    { type: integer, format: int64 }
        properties:
          type: object
          additionalProperties: { type: string }
        description:  { type: string }

    ComputeProfile:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        devices:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    ComputeProfilePage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComputeProfile" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    ComputeProfileCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:        { type: string, minLength: 1, maxLength: 63 }
        description: { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        devices:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: string }

    ComputeNetwork:
      type: object
      required: [id, name, type]
      additionalProperties: false
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        aclNames:
          type: array
          items: { type: string }
        forwardNames:
          type: array
          items: { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    ComputeNetworkPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComputeNetwork" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    ComputeNetworkCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:        { type: string, minLength: 1, maxLength: 63 }
        description: { type: string }
        type:
          type: string
          default: bridge
        config:
          type: object
          additionalProperties: { type: string }

    ComputeStorageVolume:
      type: object
      required: [id, name, poolName]
      additionalProperties: false
      properties:
        id:          { type: string, format: uuid }
        name:        { type: string }
        description: { type: string }
        type:        { type: string }
        poolName:    { type: string }
        config:
          type: object
          additionalProperties: { type: string }
        createdAt:   { type: string, format: date-time }
        updatedAt:   { type: string, format: date-time }

    ComputeStorageVolumePage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/ComputeStorageVolume" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    ComputeStorageVolumeCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:        { type: string, minLength: 1, maxLength: 63 }
        description: { type: string }
        poolName:    { type: string, default: default }
        config:
          type: object
          additionalProperties: { type: string }

    # =========================================================================
    # DNS module schemas (WS-15)
    # =========================================================================

    DNSZone:
      type: object
      required: [id, tenantId, name, canonicalId, kind, isDnssecEnabled, createdAt]
      additionalProperties: false
      properties:
        id:             { type: string, format: uuid }
        tenantId:       { type: string, format: uuid }
        canonicalId:
          type: string
          description: The PDNS-assigned canonical id (typically the canonical name lowercased). Unique across the platform.
        name:
          type: string
          description: Canonical zone name with trailing dot ("example.com.").
        kind:
          type: string
          enum: [Native, Master, Slave]
          description: Zone topology. Lahijan uses Native by default.
        description:    { type: string }
        isDnssecEnabled:
          type: boolean
          description: Cached DNSSEC state. Flipped by the DNS service on enable/disable.
        isAxfrEnabled:
          type: boolean
          description: Cached AXFR state. Off by default per WS-12.
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }

    DNSZonePage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DNSZone" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    DNSZoneCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Canonical zone name; must end with a dot and be lowercase.
        description: { type: string }
        kind:
          type: string
          enum: [Native, Master, Slave]
          default: Native

    DNSZoneUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        description: { type: string }
        kind:
          type: string
          enum: [Native, Master, Slave]

    DNSRecord:
      type: object
      required: [id, tenantId, zoneId, name, type, content, ttl, createdAt]
      additionalProperties: false
      properties:
        id:       { type: string, format: uuid }
        tenantId: { type: string, format: uuid }
        zoneId:   { type: string, format: uuid }
        name:
          type: string
          description: Canonical record name with trailing dot.
        type:
          type: string
          description: DNS record type.
        content:
          type: string
          description: Zone-file wire form.
        ttl:
          type: integer
          description: TTL in seconds.
        prio:
          type: integer
          description: Priority for MX / SRV; 0 for types with no priority.
        disabled:
          type: boolean
          description: When true the record is served commented-out.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DNSRecordPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/DNSRecord" }
        total:  { type: integer }
        limit:  { type: integer }
        offset: { type: integer }

    DNSRecordCreateRequest:
      type: object
      required: [name, type, content]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Canonical record name with trailing dot; must belong to the zone.
        type:
          type: string
          enum: [A, AAAA, CAA, CNAME, DS, MX, NS, PTR, SOA, SRV, TLSA, TXT]
          description: DNS record type. Validated per-type.
        content:
          type: string
          description: Zone-file wire form. Validated per-type.
        ttl:
          type: integer
          minimum: 300
          maximum: 86400
          default: 3600
          description: TTL in seconds; clamped to [300, 86400].
        disabled:
          type: boolean
          default: false

    DNSRecordUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        content: { type: string }
        ttl:
          type: integer
          minimum: 300
          maximum: 86400
        disabled: { type: boolean }

    DNSTemplate:
      type: object
      required: [id, name, description, records]
      additionalProperties: false
      properties:
        id:          { type: string }
        name:        { type: string }
        description: { type: string }
        records:
          type: array
          items: { $ref: "#/components/schemas/DNSTemplateRecord" }

    DNSTemplateRecord:
      type: object
      required: [name, type, content]
      additionalProperties: false
      properties:
        name:
          type: string
          description: Canonical record name. "%s" expands to the zone id; "%w" to the zone id without the trailing dot.
        type:
          type: string
          enum: [A, AAAA, CAA, CNAME, DS, MX, NS, PTR, SOA, SRV, TLSA, TXT]
        content:
          type: string
          description: Zone-file wire form. Same "%s"/"%w" expansion as Name.
        ttl:
          type: integer
          minimum: 300
          maximum: 86400

    ApplyDNSTemplateRequest:
      type: object
      required: [templateId]
      additionalProperties: false
      properties:
        templateId:
          type: string
          description: The template id from GET /api/v1/dns/templates.

    ApplyDNSTemplateResult:
      type: object
      required: [applied]
      additionalProperties: false
      properties:
        applied:
          type: integer
          description: Number of records upserted by the template.
