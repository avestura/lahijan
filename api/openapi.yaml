# Lahijan Cloud Platform - OpenAPI 3.1 specification
#
# This file is the SINGLE SOURCE OF TRUTH for Lahijan's public HTTP API.
# Generated code (Go server types, Go client SDK, TypeScript schema + client)
# is produced from it by `make openapi-gen`. CI fails if the spec drifts from
# the committed generated code (see .github/workflows/openapi.yml).
#
# Rules (see ADR-0015 and docs/architecture/conventions.md#http-api):
#   - All public routes live under /api/v1/.
#   - Every error response uses the standard Error envelope.
#   - Backend infrastructure names (Incus, PowerDNS, SeaweedFS) NEVER appear
#     here; use the user-facing terms (compute / dns / object storage).

openapi: 3.1.0
info:
  title: Lahijan Cloud Platform API
  version: 0.1.0
  description: |
    Self-service API for compute, DNS, and object storage. Lahijan wraps the
    operator's infrastructure and exposes a single, tenant-scoped surface.

    All timestamps are RFC 3339 UTC strings. All ids are UUIDs.
  contact:
    name: Lahijan Maintainers
    url: https://github.com/avestura/lahijan
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Same-origin (served behind the dashboard).

# ---------------------------------------------------------------------------
# Conventions for tags: one per user-facing module. Infrastructure-level
# endpoints (health, ping) use the "platform" tag.
# ---------------------------------------------------------------------------
tags:
  - name: platform
    description: Infrastructure endpoints (health, liveness, ping).
  - name: auth
    description: Authentication and the current user.

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Service health probe
      description: |
        Returns the service health. Intended for orchestrators and load
        balancers; not a privileged endpoint.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ping:
    get:
      tags: [platform]
      operationId: ping
      summary: Round-trip probe for the API pipeline
      description: |
        Returns a pong with the current server timestamp. Proves the OpenAPI
        -> oapi-codegen -> Fiber pipeline is wired end to end. Emits an
        OpenTelemetry trace span.
      security: []
      responses:
        "200":
          description: Pong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user account
      description: |
        Creates a user with an argon2id password hash, opens a session, issues a
        refresh token (set as cookies), and emails a verification link. The
        response returns the new user; the session cookie and refresh-token
        cookie are set on the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Verifies credentials and opens a session. Sets the session and
        refresh-token cookies; returns the authenticated user.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out the current session
      description: |
        Revokes the session and every refresh token in its family, then clears
        the session and refresh cookies. Idempotent.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token
      description: |
        Consumes the presented refresh token (from the cookie or body) and
        issues a new one in the same family. Reusing a previously rotated
        token revokes the whole family and the session (reuse detection) and
        returns 401.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed; new cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email verification token
      description: |
        Consumes the single-use token emailed at registration (or via
        resend-verification) and marks the user's email verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the email verification link
      description: |
        Issues a fresh verify-email token and emails the link. Returns the same
        response whether or not the email is registered (no enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification email sent (or would be sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password-reset link
      description: |
        Emails a single-use reset link to the user if the account exists.
        Always returns 200 (no account enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Reset email sent (or would be sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Reset the password with a token
      description: |
        Consumes the single-use reset token and sets the new password. The new
        password is strength-validated; the consumed token cannot be reused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Current authenticated user
      description: Returns the user identified by the session cookie or PAT.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      operationId: updateCurrentUser
      summary: Update the current user's profile
      description: |
        Updates display name and/or locale and/or password. A password change
        requires currentPassword. An email change requests a confirmation
        email and does not swap the email until confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated; the new user state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/personal-access-tokens:
    get:
      tags: [auth]
      operationId: listPersonalAccessTokens
      summary: List the current user's PATs
      description: Returns the caller's non-revoked personal access tokens.
      responses:
        "200":
          description: The caller's PATs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      operationId: createPersonalAccessToken
      summary: Issue a personal access token
      description: |
        Mints a PAT with the requested scopes and expiry. The raw token is
        returned exactly once in the response body; only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalAccessTokenRequest"
      responses:
        "201":
          description: The new PAT (raw token included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/personal-access-tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: deletePersonalAccessToken
      summary: Revoke a personal access token
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # Standard headers reused across auth responses.
  headers:
    SetCookie:
      description: |
        An HTTP-only cookie carrying either the session id or the refresh
        token. Lahijan sets both on register/login/refresh and clears them on
        logout.
      schema:
        type: string
        examples: ["lahijan_session=...; HttpOnly; SameSite=Lax"]

  # Standard error responses reused across the API.
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: bad_request
              message: "request body failed validation"
              details:
                field: email
    Unauthorized:
      description: Authentication is required or has failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: "authentication required"
    Forbidden:
      description: The caller is not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: "permission denied"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: "resource not found"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: "an account with this email already exists"
    NotImplemented:
      description: The endpoint exists but is not implemented yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_implemented
              message: "not implemented yet"
    InternalError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal
              message: "internal server error"

  schemas:
    # The standard error envelope. Every error response in the API is shaped
    # exactly like this: { error: { code, message, details? } }.
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Machine-readable error code (snake_case).
              examples: [bad_request, unauthorized, forbidden, not_found, internal]
            message:
              type: string
              description: Human-readable error message, safe to show users.
            details:
              description: |
                Optional structured details about the error (e.g. per-field
                validation errors). Free-form object; consumers must not assume
                a fixed schema.
              type: object
              additionalProperties: true

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Coarse service health.
        version:
          type: string
          description: Build version of the running binary.

    Pong:
      type: object
      required: [pong]
      additionalProperties: false
      properties:
        pong:
          type: string
          description: RFC 3339 timestamp at which the server handled the request.
          format: date-time
          examples: ["2026-07-17T12:00:00Z"]

    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique user id.
        email:
          type: string
          format: email
          description: Unique user email.
        displayName:
          type: string
          description: Optional human-friendly display name.
          nullable: true
        memberships:
          type: array
          description: Tenant memberships held by this user.
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      required: [tenantId, role]
      additionalProperties: false
      properties:
        tenantId:
          type: string
          format: uuid
        role:
          type: string
          description: Role held within the tenant (e.g. owner, admin, member).

    # ---------------------------------------------------------------------
    # Auth request/response schemas (WS-06).
    # ---------------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Plaintext password; hashed with argon2id before storage.
        displayName:
          type: string
          nullable: true
        locale:
          type: string
          description: Preferred locale code (en, fa). Defaults to en.
          default: en

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LogoutRequest:
      type: object
      additionalProperties: false
      description: |
        Optional. When omitted, the refresh-token cookie is used. Pass an
        explicit refresh token when logging out a non-browser client.
      properties:
        refreshToken:
          type: string

    RefreshRequest:
      type: object
      additionalProperties: false
      description: |
        Optional. When omitted, the refresh-token cookie is used. Pass an
        explicit refresh token when rotating from a non-browser client.
      properties:
        refreshToken:
          type: string

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use signed token from an email link.

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          nullable: true
        locale:
          type: string
        currentPassword:
          type: string
          format: password
          description: Required when changing the password.
        newPassword:
          type: string
          format: password
          description: When set, currentPassword must also be present.
        newEmail:
          type: string
          format: email
          description: |
            Triggers an email-change confirmation link; the email is not swapped
            until the link is consumed.

    AuthResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"

    CreatePersonalAccessTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        scopes:
          type: array
          description: Permission slugs (scope.action) the PAT grants.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    PersonalAccessToken:
      type: object
      required: [id, name, scopes, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        token:
          type: string
          description: The raw PAT. Present ONLY on create; never returned again.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: Localized human-readable confirmation.
