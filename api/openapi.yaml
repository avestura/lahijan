# Lahijan Cloud Platform - OpenAPI 3.1 specification
#
# This file is the SINGLE SOURCE OF TRUTH for Lahijan's public HTTP API.
# Generated code (Go server types, Go client SDK, TypeScript schema + client)
# is produced from it by `make openapi-gen`. CI fails if the spec drifts from
# the committed generated code (see .github/workflows/openapi.yml).
#
# Rules (see ADR-0015 and docs/architecture/conventions.md#http-api):
#   - All public routes live under /api/v1/.
#   - Every error response uses the standard Error envelope.
#   - Backend infrastructure names (Incus, PowerDNS, SeaweedFS) NEVER appear
#     here; use the user-facing terms (compute / dns / object storage).

openapi: 3.1.0
info:
  title: Lahijan Cloud Platform API
  version: 0.1.0
  description: |
    Self-service API for compute, DNS, and object storage. Lahijan wraps the
    operator's infrastructure and exposes a single, tenant-scoped surface.

    All timestamps are RFC 3339 UTC strings. All ids are UUIDs.
  contact:
    name: Lahijan Maintainers
    url: https://github.com/avestura/lahijan
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0

servers:
  - url: /
    description: Same-origin (served behind the dashboard).

# ---------------------------------------------------------------------------
# Conventions for tags: one per user-facing module. Infrastructure-level
# endpoints (health, ping) use the "platform" tag.
# ---------------------------------------------------------------------------
tags:
  - name: platform
    description: Infrastructure endpoints (health, liveness, ping).
  - name: auth
    description: Authentication and the current user.
  - name: audit
    description: The append-only audit trail of privileged actions.
  - name: admin
    description: Platform-admin endpoints (cross-tenant; platform.admin role only).

# ---------------------------------------------------------------------------
# Paths
# ---------------------------------------------------------------------------
paths:
  /health:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Service health probe
      description: |
        Returns the service health. Intended for orchestrators and load
        balancers; not a privileged endpoint.
      security: []
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is degraded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/ping:
    get:
      tags: [platform]
      operationId: ping
      summary: Round-trip probe for the API pipeline
      description: |
        Returns a pong with the current server timestamp. Proves the OpenAPI
        -> oapi-codegen -> Fiber pipeline is wired end to end. Emits an
        OpenTelemetry trace span.
      security: []
      responses:
        "200":
          description: Pong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pong"

  /api/v1/auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Register a new user account
      description: |
        Creates a user with an argon2id password hash, opens a session, issues a
        refresh token (set as cookies), and emails a verification link. The
        response returns the new user; the session cookie and refresh-token
        cookie are set on the response.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Account created; session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Log in with email and password
      description: |
        Verifies credentials and opens a session. Sets the session and
        refresh-token cookies; returns the authenticated user.

        When MFA is required (the user has at least one enrolled factor OR
        any of their tenant memberships has mfa_required = TRUE), the
        response is 202 Accepted with a pending_session_token instead of
        200 OK with a session. The caller then completes the MFA challenge
        at /api/v1/auth/mfa/challenge to obtain the real session.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; session cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "202":
          description: |
            MFA challenge required. The pending_session_token is also set
            in a short-lived cookie (lahijan_mfa_pending) for browser
            clients. Exchange it for the real session at
            /api/v1/auth/mfa/challenge.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MFAChallengeRequired"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Log out the current session
      description: |
        Revokes the session and every refresh token in its family, then clears
        the session and refresh cookies. Idempotent.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LogoutRequest"
      responses:
        "200":
          description: Logged out.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      summary: Rotate the refresh token
      description: |
        Consumes the presented refresh token (from the cookie or body) and
        issues a new one in the same family. Reusing a previously rotated
        token revokes the whole family and the session (reuse detection) and
        returns 401.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Refreshed; new cookies set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SetCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Confirm an email verification token
      description: |
        Consumes the single-use token emailed at registration (or via
        resend-verification) and marks the user's email verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRequest"
      responses:
        "200":
          description: Email verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Resend the email verification link
      description: |
        Issues a fresh verify-email token and emails the link. Returns the same
        response whether or not the email is registered (no enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Verification email sent (or would be sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/password-reset/request:
    post:
      tags: [auth]
      operationId: requestPasswordReset
      summary: Request a password-reset link
      description: |
        Emails a single-use reset link to the user if the account exists.
        Always returns 200 (no account enumeration).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          description: Reset email sent (or would be sent).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [auth]
      operationId: confirmPasswordReset
      summary: Reset the password with a token
      description: |
        Consumes the single-use reset token and sets the new password. The new
        password is strength-validated; the consumed token cannot be reused.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
      responses:
        "200":
          description: Password reset.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Current authenticated user
      description: Returns the user identified by the session cookie or PAT.
      responses:
        "200":
          description: The current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      operationId: updateCurrentUser
      summary: Update the current user's profile
      description: |
        Updates display name and/or locale and/or password. A password change
        requires currentPassword. An email change requests a confirmation
        email and does not swap the email until confirmed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMeRequest"
      responses:
        "200":
          description: Updated; the new user state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/personal-access-tokens:
    get:
      tags: [auth]
      operationId: listPersonalAccessTokens
      summary: List the current user's PATs
      description: Returns the caller's non-revoked personal access tokens.
      responses:
        "200":
          description: The caller's PATs.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalAccessToken"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [auth]
      operationId: createPersonalAccessToken
      summary: Issue a personal access token
      description: |
        Mints a PAT with the requested scopes and expiry. The raw token is
        returned exactly once in the response body; only its hash is stored.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePersonalAccessTokenRequest"
      responses:
        "201":
          description: The new PAT (raw token included).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalAccessToken"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/auth/personal-access-tokens/{tokenId}:
    delete:
      tags: [auth]
      operationId: deletePersonalAccessToken
      summary: Revoke a personal access token
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Revoked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  # -------------------------------------------------------------------------
  # External identity providers (WS-07a): OAuth 2.0 social login + OIDC.
  # -------------------------------------------------------------------------
  # Each provider has a start + callback pair. The start endpoint mints a
  # signed state token + PKCE verifier, sets them as short-lived cookies, and
  # 302s the browser to the IdP. The callback verifies the state, exchanges
  # the code for tokens, fetches the profile, and either logs the user in or
  # links the identity to the logged-in user (via the lahijan_link_uid cookie
  # set by the start endpoint when called from an authenticated session).

  /api/v1/auth/oauth/{provider}/start:
    get:
      tags: [auth]
      operationId: startOAuth
      summary: Begin an OAuth 2.0 social-login flow
      description: |
        Mints a signed CSRF state token + PKCE verifier, sets them as
        short-lived cookies, and 302s the browser to the IdP's authorization
        endpoint.

        When called from an authenticated session (the user is linking a new
        IdP to their existing account) the response also sets a
        lahijan_link_uid cookie carrying the user's id; the callback enforces
        the link against the user who started the flow.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The configured OAuth provider key (e.g. google, github).
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the IdP authorization URL.
          headers:
            Location:
              description: The absolute IdP authorization URL.
              schema:
                type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          description: The provider key is not configured or not enabled.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      operationId: callbackOAuth
      summary: Finish an OAuth 2.0 social-login flow
      description: |
        Consumes the IdP's redirect (?code + ?state), verifies the state
        against the cookie nonce, exchanges the code for tokens (with PKCE),
        fetches the profile, and either:
          - logs the user in (sets the session + refresh cookies), or
          - links the identity to the logged-in user (when lahijan_link_uid
            is set), or
          - returns a "completion required" envelope when the IdP returned no
            email and no user could be created.

        On success the browser is redirected to the dashboard root (`/`); on
        failure it is redirected to the login page with an error query.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the dashboard or login page.
          headers:
            Location:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/v1/auth/oidc/{provider}/start:
    get:
      tags: [auth]
      operationId: startOIDC
      summary: Begin an OpenID Connect flow
      description: |
        Same cookie + state pattern as /auth/oauth/{provider}/start but for
        OIDC providers. Mints the PKCE verifier AND the OIDC nonce in addition
        to the state token; both are persisted as short-lived cookies.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the IdP authorization URL.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The provider key is not configured or not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/oidc/{provider}/callback:
    get:
      tags: [auth]
      operationId: callbackOIDC
      summary: Finish an OpenID Connect flow
      description: |
        Consumes the IdP's redirect, verifies state + nonce, exchanges the
        code for an access_token + id_token, verifies the id_token (signature
        via JWKS, audience, expiry, nonce), and either logs the user in or
        links the identity.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the dashboard or login page.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  # External identity providers (WS-07b): SAML 2.0 service-provider flow.
  # -------------------------------------------------------------------------
  # Three endpoints: the SP metadata (served at a well-known URL so the IdP
  # can register us), the SP-initiated start (mints a signed AuthnRequest +
  # redirects the browser to the IdP), and the Assertion Consumer Service
  # (POST endpoint the IdP posts the signed assertion back to).

  /api/v1/auth/saml/metadata:
    get:
      tags: [auth]
      operationId: metadataSAML
      summary: SAML service-provider metadata
      description: |
        Serves the SP metadata XML the IdP registers Lahijan under. The
        metadata carries the SP's entity ID, the ACS URL (POST binding), and
        the SP's signing certificate so the IdP can verify signed
        AuthnRequests.

        When no SAML provider is configured, returns a 501 with a localised
        "feature disabled" envelope.
      security: []
      responses:
        "200":
          description: SP metadata XML.
          content:
            application/xml:
              schema:
                type: string
        "501":
          description: SAML is not enabled on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/saml/{provider}/start:
    get:
      tags: [auth]
      operationId: startSAML
      summary: Begin a SAML 2.0 service-provider flow
      description: |
        Mints a signed SAML AuthnRequest, sets a signed CSRF state token as a
        short-lived cookie, and 302s the browser to the IdP's SSO endpoint
        (HTTP-Redirect binding).

        When called from an authenticated session (the user is linking a new
        SAML IdP to their existing account) the response also sets a
        lahijan_link_uid cookie carrying the user's id; the ACS enforces the
        link against the user who started the flow.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          description: The configured SAML provider key (e.g. entra, okta).
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the IdP SSO URL.
          headers:
            Location:
              description: The absolute IdP SSO URL carrying SAMLRequest + RelayState.
              schema: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404":
          description: The provider key is not configured or not enabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/auth/saml/{provider}/acs:
    post:
      tags: [auth]
      operationId: assertionConsumerServiceSAML
      summary: SAML Assertion Consumer Service
      description: |
        Consumes the IdP's POSTed SAML response (form fields SAMLResponse +
        RelayState), verifies the state token against the cookie nonce,
        verifies the signed assertion (signature via the IdP's published
        certificate, audience, recipient, conditions, InResponseTo replay
        check), and either:
          - logs the user in (sets the session + refresh cookies), or
          - links the SAML identity to the logged-in user (when
            lahijan_link_uid is set), or
          - returns a "completion required" envelope when the (provider,
            name_id) is unknown and just-in-time user creation is disabled.

        On success the browser is redirected to the dashboard root (`/`);
        on failure it is redirected to the login page with an error query.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [SAMLResponse]
              properties:
                SAMLResponse:
                  type: string
                  description: Base64-encoded SAML Response XML the IdP signed.
                RelayState:
                  type: string
                  description: The relay state the SP emitted on /start (carries the CSRF token).
      responses:
        "302":
          description: Redirect to the dashboard or login page.
          headers:
            Location: { schema: { type: string } }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/v1/me/identities:
    get:
      tags: [auth]
      operationId: listMyIdentities
      summary: List the current user's linked external identities
      description: |
        Returns every external identity (OAuth + OIDC) linked to the current
        user. Tokens are NOT included; only the provider key, subject, and
        scopes are returned.
      responses:
        "200":
          description: The caller's linked identities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ExternalIdentity"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/v1/me/identities/{identityId}:
    delete:
      tags: [auth]
      operationId: deleteMyIdentity
      summary: Unlink an external identity from the current user
      description: |
        Removes the (user, provider) link. Refuses if removing it would leave
        the user with no way to log in (no password and no other identities).
      parameters:
        - name: identityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Unlinked.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: |
            Removing this identity would leave the user with no way to log in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  # -------------------------------------------------------------------------
  # Multi-factor authentication (WS-07c)
  # -------------------------------------------------------------------------
  # Self-service factor enrollment lives under /api/v1/me/mfa/*. The login
  # challenge endpoint is under /api/v1/auth/mfa/challenge because the caller
  # is anonymous (only carries the pending_session_token).

  /api/v1/me/mfa/totp/enroll:
    post:
      tags: [auth]
      operationId: enrollTOTP
      summary: Begin TOTP enrollment
      description: |
        Generates a fresh TOTP secret, AES-GCM-encrypts it at rest, and
        returns the raw secret + the otpauth:// provisioning URI for the
        dashboard to render as a QR code. Until the user confirms with a
        valid 6-digit code at /verify, the secret does NOT count as an
        enrolled factor (login does not challenge for it).

        Re-enrollment over a confirmed factor fails with 409 — the user
        must explicitly disable first.
      responses:
        "200":
          description: The new TOTP secret + provisioning URI.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TOTPEnrollResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: TOTP is already enrolled; disable first.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/mfa/totp/verify:
    post:
      tags: [auth]
      operationId: verifyTOTP
      summary: Confirm TOTP enrollment with a 6-digit code
      description: |
        Marks the pending TOTP secret as confirmed (the user's
        authenticator app produced a matching 6-digit code). On success
        the factor becomes effective and a fresh batch of recovery codes
        is generated (returned once via /me/mfa/recovery).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TOTPVerifyRequest"
      responses:
        "200":
          description: TOTP confirmed; recovery codes generated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesBatch"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/totp/disable:
    post:
      tags: [auth]
      operationId: disableTOTP
      summary: Disable TOTP
      description: |
        Removes the user's TOTP factor. Per the WS-07c default the caller
        MUST supply their current password (re-authentication) before the
        factor is removed; this prevents a stolen session cookie from
        silently disarming MFA.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFADisableRequest"
      responses:
        "200":
          description: TOTP disabled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/register/begin:
    post:
      tags: [auth]
      operationId: beginWebAuthnRegistration
      summary: Begin WebAuthn / passkey registration
      description: |
        Returns the PublicKeyCredentialCreationOptions the browser feeds
        to navigator.credentials.create(). The dashboard persists the
        returned ceremony session (typically in a short-lived cookie or
        local storage) and POSTs it back at /register/finish.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnBeginRequest"
      responses:
        "200":
          description: The ceremony options + opaque session handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnBeginRegistrationResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "501":
          description: WebAuthn is not configured on this server.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/me/mfa/webauthn/register/finish:
    post:
      tags: [auth]
      operationId: finishWebAuthnRegistration
      summary: Finish WebAuthn / passkey registration
      description: |
        Accepts the attestation response the browser POSTed after
        navigator.credentials.create() succeeded. Verifies the signature,
        persists the credential, and (on success) returns a small
        confirmation envelope.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnFinishRegistrationRequest"
      responses:
        "200":
          description: The credential was registered.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/login/begin:
    post:
      tags: [auth]
      operationId: beginWebAuthnLogin
      summary: Begin a WebAuthn login ceremony
      description: |
        Returns the PublicKeyCredentialRequestOptions the browser feeds
        to navigator.credentials.get() during an MFA challenge. The
        caller MUST carry a valid pending_session_token (issued by the
        password/IdP login step when MFA is required).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginBeginRequest"
      responses:
        "200":
          description: The ceremony options + opaque session handle.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnLoginBeginResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/login/finish:
    post:
      tags: [auth]
      operationId: finishWebAuthnLogin
      summary: Finish a WebAuthn login ceremony
      description: |
        Accepts the assertion response the browser POSTed after
        navigator.credentials.get() succeeded. On success the MFA
        challenge is complete; the caller still POSTs to
        /api/v1/auth/mfa/challenge with kind=webauthn-finished to
        exchange the pending_session_token for the real session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnLoginFinishRequest"
      responses:
        "200":
          description: The assertion verified; the challenge is complete.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/me/mfa/webauthn/credentials/{credentialId}:
    delete:
      tags: [auth]
      operationId: deleteWebAuthnCredential
      summary: Remove a WebAuthn credential
      description: |
        Revokes a single WebAuthn credential (one of the user's passkeys).
        Re-authentication (current password) is required when this would
        leave the user with zero factors AND MFA is required by policy.
      parameters:
        - name: credentialId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Credential removed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/me/mfa/recovery:
    get:
      tags: [auth]
      operationId: listMyRecoveryCodes
      summary: List recovery code metadata (no raw codes)
      description: |
        Returns metadata about the user's recovery codes (count remaining,
        created_at per row). The raw codes are NEVER returned by this
        endpoint — they were shown exactly once at generation time.
      responses:
        "200":
          description: The user's recovery code rows (raw codes stripped).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesListResponse"
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [auth]
      operationId: regenerateMyRecoveryCodes
      summary: Regenerate the recovery code batch
      description: |
        Wipes the user's existing recovery codes (used + unused) and
        issues a fresh batch. The raw codes are returned exactly once;
        Lahijan cannot show them again.
      responses:
        "200":
          description: The fresh batch of recovery codes (shown once).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecoveryCodesBatch"
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/auth/mfa/challenge:
    post:
      tags: [auth]
      operationId: challengeMFA
      summary: Verify an MFA challenge and issue the real session
      description: |
        Accepts a pending_session_token (from /login or /oauth/callback
        when MFA was required) plus an MFA code:

          - kind=totp:     code is a 6-digit TOTP value
          - kind=recovery: code is a recovery code
          - kind=webauthn: assertion fields from the /webauthn/login/finish response

        On success the pending_session_token is consumed and the real
        session + refresh token are issued (set as cookies, just like
        /login). On failure the failed_attempts counter is bumped; at
        maxAttempts=5 the pending token is revoked (brute-force lockout).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MFAChallengeRequest"
      responses:
        "200":
          description: MFA succeeded; real session cookies set.
          headers:
            Set-Cookie: { $ref: "#/components/headers/SetCookie" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: |
            The pending token is invalid, expired, already used, or
            revoked; OR the supplied code did not match.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Too many failed attempts; pending session revoked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  # -------------------------------------------------------------------------
  # Audit log (WS-08)
  # -------------------------------------------------------------------------
  # /api/v1/audit returns the tenant-scoped audit trail; the caller must be a
  # member of the tenant (set via X-Tenant-Id) and hold audit.read.
  # /api/v1/audit/global is the superuser variant (audit.read_global).

  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: List audit events for the current tenant
      description: |
        Returns the tenant-scoped audit trail, filtered by the optional query
        parameters. The caller must be authenticated, supply a tenant scope
        via the X-Tenant-Id header, and hold the audit.read permission.

        System-level events (e.g. auth login) carry a NULL tenant_id and are
        visible from every tenant so operators can trace user flows end to
        end.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, failure, pending] }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, system, plugin] }
        - name: fromTs
          in: query
          schema: { type: string, format: date-time }
        - name: toTs
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/{auditId}:
    get:
      tags: [audit]
      operationId: getAudit
      summary: Fetch a single audit event by id
      description: |
        Returns the audit row plus its outcome trail (the latest outcome's
        status is the event's current status). System-level events (NULL
        tenant_id) are visible from any tenant.
      parameters:
        - name: auditId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The audit event.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/audit/export:
    get:
      tags: [audit]
      operationId: exportAudit
      summary: Export the tenant audit log (CSV or JSON)
      description: |
        Streams the matching audit rows as either CSV (the default) or JSON.
        Same filters as /audit but no pagination — the caller gets every
        matching row, chunked. Requires the audit.export permission; the
        export itself is recorded as an audit event (action: audit.export).
      parameters:
        - $ref: "#/components/parameters/ExportFormat"
        - name: actorUserId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string }
        - name: resourceType
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string, enum: [success, failure, pending] }
        - name: actorType
          in: query
          schema: { type: string, enum: [user, system, plugin] }
        - name: fromTs
          in: query
          schema: { type: string, format: date-time }
        - name: toTs
          in: query
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: The audit rows in the requested format.
          content:
            text/csv:
              schema: { type: string }
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  # -------------------------------------------------------------------------
  # Admin: job system (WS-09). Platform-admin-only endpoints for inspecting
  # and controlling River's durable job queue. Every privileged action also
  # emits an audit event (action: platform.job.retry | platform.job.cancel).
  # River's built-in web UI is mounted at /admin/jobs/ui (NOT under /api/v1/
  # because it ships its own REST API); the same platform.jobs.read
  # permission gates both.
  # -------------------------------------------------------------------------

  /api/v1/admin/jobs:
    get:
      tags: [admin]
      operationId: listAdminJobs
      summary: List queued / running / failed jobs
      description: |
        Returns a filtered, paginated page of jobs from the durable job
        queue (River). The caller MUST hold the platform.jobs.read
        permission (i.e. be a platform.admin). Cross-tenant by design:
        jobs are global; the platform admin can see every tenant's work.
      parameters:
        - $ref: "#/components/parameters/PageLimit"
        - $ref: "#/components/parameters/PageOffset"
        - name: state
          in: query
          description: |
            Filter by job state. When omitted, every state is returned.
            Multiple values are OR'd together.
          schema:
            type: array
            items:
              type: string
              enum: [available, pending, retryable, running, scheduled, completed, cancelled, discarded]
        - name: kind
          in: query
          description: Filter by exact job kind (e.g. "billing.usage.rollup").
          schema:
            type: string
        - name: queue
          in: query
          description: Filter by queue name.
          schema:
            type: string
      responses:
        "200":
          description: A page of jobs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminJobPage"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/v1/admin/jobs/{jobId}:
    get:
      tags: [admin]
      operationId: getAdminJob
      summary: Fetch a single job by id
      description: |
        Returns the full job row (state, args, attempt history, errors) for
        the given id. Requires platform.jobs.read.
      parameters:
        - name: jobId
          in: path
          required: true
          description: The River job id (a bigserial, not a UUID).
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The job row.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/admin/jobs/{jobId}/retry:
    post:
      tags: [admin]
      operationId: retryAdminJob
      summary: Manually retry a discarded (DLQ'd) job
      description: |
        Re-queues a discarded job for an immediate retry. Requires the
        platform.jobs.retry permission. The action is recorded as an audit
        event (action: platform.job.retry).
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The job was re-queued; the updated row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The job is not in a retryable state (e.g. still running).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/admin/jobs/{jobId}/cancel:
    post:
      tags: [admin]
      operationId: cancelAdminJob
      summary: Cancel a queued or running job
      description: |
        Marks the job as cancelled. Already-running jobs get a cancellation
        signal via context. Requires the platform.jobs.cancel permission.
        The action is recorded as an audit event (action:
        platform.job.cancel).
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The job was cancelled; the updated row is returned.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminJob" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The job is already in a terminal state.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

# ---------------------------------------------------------------------------
# Components
# ---------------------------------------------------------------------------
components:
  # Standard headers reused across auth responses.
  headers:
    SetCookie:
      description: |
        An HTTP-only cookie carrying either the session id or the refresh
        token. Lahijan sets both on register/login/refresh and clears them on
        logout.
      schema:
        type: string
        examples: ["lahijan_session=...; HttpOnly; SameSite=Lax"]

  # Reusable query parameters.
  parameters:
    PageLimit:
      name: limit
      in: query
      description: Maximum number of items to return (1..200).
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    PageOffset:
      name: offset
      in: query
      description: Number of items to skip for pagination.
      schema: { type: integer, minimum: 0, default: 0 }
    ExportFormat:
      name: format
      in: query
      description: Output format for the export. Defaults to csv.
      schema: { type: string, enum: [csv, json], default: csv }

  # Standard error responses reused across the API.
  responses:
    BadRequest:
      description: The request was malformed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: bad_request
              message: "request body failed validation"
              details:
                field: email
    Unauthorized:
      description: Authentication is required or has failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: "authentication required"
    Forbidden:
      description: The caller is not permitted to perform this action.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: forbidden
              message: "permission denied"
    NotFound:
      description: The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: "resource not found"
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: conflict
              message: "an account with this email already exists"
    NotImplemented:
      description: The endpoint exists but is not implemented yet.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_implemented
              message: "not implemented yet"
    InternalError:
      description: An unexpected error occurred.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal
              message: "internal server error"

  schemas:
    # The standard error envelope. Every error response in the API is shaped
    # exactly like this: { error: { code, message, details? } }.
    Error:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              type: string
              description: Machine-readable error code (snake_case).
              examples: [bad_request, unauthorized, forbidden, not_found, internal]
            message:
              type: string
              description: Human-readable error message, safe to show users.
            details:
              description: |
                Optional structured details about the error (e.g. per-field
                validation errors). Free-form object; consumers must not assume
                a fixed schema.
              type: object
              additionalProperties: true

    Health:
      type: object
      required: [status, version]
      additionalProperties: false
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: Coarse service health.
        version:
          type: string
          description: Build version of the running binary.

    Pong:
      type: object
      required: [pong]
      additionalProperties: false
      properties:
        pong:
          type: string
          description: RFC 3339 timestamp at which the server handled the request.
          format: date-time
          examples: ["2026-07-17T12:00:00Z"]

    User:
      type: object
      required: [id, email]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: Unique user id.
        email:
          type: string
          format: email
          description: Unique user email.
        displayName:
          type: string
          description: Optional human-friendly display name.
          nullable: true
        memberships:
          type: array
          description: Tenant memberships held by this user.
          items:
            $ref: "#/components/schemas/Membership"

    Membership:
      type: object
      required: [tenantId, role]
      additionalProperties: false
      properties:
        tenantId:
          type: string
          format: uuid
        role:
          type: string
          description: Role held within the tenant (e.g. owner, admin, member).

    # ---------------------------------------------------------------------
    # Auth request/response schemas (WS-06).
    # ---------------------------------------------------------------------

    RegisterRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          description: Plaintext password; hashed with argon2id before storage.
        displayName:
          type: string
          nullable: true
        locale:
          type: string
          description: Preferred locale code (en, fa). Defaults to en.
          default: en

    LoginRequest:
      type: object
      required: [email, password]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    LogoutRequest:
      type: object
      additionalProperties: false
      description: |
        Optional. When omitted, the refresh-token cookie is used. Pass an
        explicit refresh token when logging out a non-browser client.
      properties:
        refreshToken:
          type: string

    RefreshRequest:
      type: object
      additionalProperties: false
      description: |
        Optional. When omitted, the refresh-token cookie is used. Pass an
        explicit refresh token when rotating from a non-browser client.
      properties:
        refreshToken:
          type: string

    TokenRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          description: The single-use signed token from an email link.

    EmailRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    PasswordResetConfirmRequest:
      type: object
      required: [token, newPassword]
      additionalProperties: false
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password

    UpdateMeRequest:
      type: object
      additionalProperties: false
      properties:
        displayName:
          type: string
          nullable: true
        locale:
          type: string
        currentPassword:
          type: string
          format: password
          description: Required when changing the password.
        newPassword:
          type: string
          format: password
          description: When set, currentPassword must also be present.
        newEmail:
          type: string
          format: email
          description: |
            Triggers an email-change confirmation link; the email is not swapped
            until the link is consumed.

    AuthResponse:
      type: object
      required: [user]
      additionalProperties: false
      properties:
        user:
          $ref: "#/components/schemas/User"

    MFAChallengeRequired:
      type: object
      required: [pendingSessionToken, mfaRequired]
      additionalProperties: false
      properties:
        mfaRequired:
          type: boolean
          description: Always true; signals the 202 path.
        pendingSessionToken:
          type: string
          description: |
            Short-lived, single-use token. POST it to
            /api/v1/auth/mfa/challenge with the MFA code to obtain the
            real session cookies.
        enrolledFactors:
          type: array
          description: |
            The factors the user has enrolled. Lets the dashboard pick
            the default challenge UI (TOTP input vs WebAuthn prompt).
          items:
            type: string
            enum: [totp, webauthn]

    CreatePersonalAccessTokenRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
        scopes:
          type: array
          description: Permission slugs (scope.action) the PAT grants.
          items:
            type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true

    PersonalAccessToken:
      type: object
      required: [id, name, scopes, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        token:
          type: string
          description: The raw PAT. Present ONLY on create; never returned again.
        expiresAt:
          type: string
          format: date-time
          nullable: true
        lastUsedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time

    MessageResponse:
      type: object
      required: [message]
      additionalProperties: false
      properties:
        message:
          type: string
          description: Localized human-readable confirmation.

    # External identity (WS-07a + WS-07b): a link between a user and an
    # OAuth/OIDC/SAML IdP. Tokens are NOT included; only the provider key,
    # the IdP-stable subject, and the scopes the IdP granted at issue/refresh
    # time. For SAML identities the scopes array is empty and the optional
    # attributes map carries the snapshot from the most recent assertion.
    ExternalIdentity:
      type: object
      required: [id, provider, subject, scopes, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The identity row id.
        provider:
          type: string
          description: |
            The provider key: a configured OAuth preset (google, github),
            "oidc:<config_key>" for an OIDC IdP, or "saml:<config_key>" for
            a SAML 2.0 IdP.
        subject:
          type: string
          description: |
            The IdP-stable subject identifier. For OAuth/OIDC this is the
            `sub` claim; for SAML it is the NameID.
        scopes:
          type: array
          description: |
            Scope strings the IdP granted at issue/refresh time. Empty for
            SAML identities (SAML has no notion of scopes).
          items:
            type: string
        attributes:
          type: object
          description: |
            SAML-only: snapshot of the attribute statement from the most
            recent assertion. Each key is a SAML attribute name (typically a
            URI like http://schemas.xmlsoap.org/ws/2005/05/identity/claims/
            emailaddress); each value is an array of strings (SAML attributes
            are multi-valued). NULL/absent for OAuth/OIDC identities.
          additionalProperties:
            type: array
            items:
              type: string
        expiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            When the access_token expires; NULL when non-expiring or for
            SAML identities (SAML assertions are short-lived and not stored).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    # ---------------------------------------------------------------------
    # Audit schemas (WS-08).
    # ---------------------------------------------------------------------

    AuditEvent:
      type: object
      required: [id, action, resourceType, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          description: The audit row id.
        tenantId:
          type: string
          format: uuid
          nullable: true
          description: NULL for system-level events (e.g. login).
        actorUserId:
          type: string
          format: uuid
          nullable: true
          description: NULL when the actor is the system.
        actorType:
          type: string
          enum: [user, system, plugin]
        action:
          type: string
          description: |
            The privileged action slug, formatted scope.action
            (e.g. compute.instance.create). The localised label can be
            rendered via audit.action_<slug> i18n keys.
        resourceType:
          type: string
        resourceId:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
          enum: [success, failure, pending]
          description: |
            The current status. When the event has outcome rows, this is the
            latest outcome's status; otherwise it is the row's initial status.
        requestId:
          type: string
          nullable: true
        metadata:
          type: object
          additionalProperties: true
          description: Free-form structured details recorded at emit time.
        createdAt:
          type: string
          format: date-time
        outcomes:
          type: array
          description: The outcome trail, newest first. Empty when Emit was fire-and-forget.
          items:
            $ref: "#/components/schemas/AuditOutcome"

    AuditOutcome:
      type: object
      required: [id, status, createdAt]
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [success, failure, pending]
        details:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time

    AuditPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AuditEvent" }
        total:
          type: integer
          format: int64
          description: Total events matching the filter (for pagination UI).
        limit:
          type: integer
        offset:
          type: integer

    # ---------------------------------------------------------------------
    # Admin job schemas (WS-09). Mirror River's river_job row shape, with a
    # few omissions (unique_key, unique_states) the admin UI doesn't need.
    # ---------------------------------------------------------------------

    AdminJob:
      type: object
      required: [id, kind, state, queue, priority, attempt, maxAttempts, createdAt, scheduledAt]
      additionalProperties: false
      properties:
        id:
          type: integer
          format: int64
          description: The River job id (bigserial).
        kind:
          type: string
          description: The stable "scope.action" job kind.
        state:
          type: string
          enum: [available, pending, retryable, running, scheduled, completed, cancelled, discarded]
        queue:
          type: string
        priority:
          type: integer
          minimum: 1
          maximum: 4
        attempt:
          type: integer
          description: The current attempt number (0 before the first run).
        maxAttempts:
          type: integer
        args:
          type: object
          additionalProperties: true
          description: The decoded job payload (JobArgs).
        attemptedBy:
          type: array
          items:
            type: string
        errors:
          type: array
          description: Per-attempt error trail, earliest first.
          items:
            $ref: "#/components/schemas/AdminJobError"
        tags:
          type: array
          items:
            type: string
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        scheduledAt:
          type: string
          format: date-time
        attemptedAt:
          type: string
          format: date-time
          nullable: true
        finalizedAt:
          type: string
          format: date-time
          nullable: true

    AdminJobError:
      type: object
      required: [attempt, at, message]
      additionalProperties: false
      properties:
        attempt:
          type: integer
        at:
          type: string
          format: date-time
        message:
          type: string

    AdminJobPage:
      type: object
      required: [items, total, limit, offset]
      additionalProperties: false
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/AdminJob" }
        total:
          type: integer
          format: int64
        limit:
          type: integer
        offset:
          type: integer

    # ---------------------------------------------------------------------
    # MFA schemas (WS-07c)
    # ---------------------------------------------------------------------

    TOTPEnrollResponse:
      type: object
      required: [secret, provisioningUri]
      additionalProperties: false
      properties:
        secret:
          type: string
          description: |
            The raw base32 TOTP secret, shown ONCE so the user can enter
            it manually if they cannot scan the QR. Persisted encrypted
            at rest.
        provisioningUri:
          type: string
          description: |
            The otpauth:// URL the dashboard encodes as a QR code.

    TOTPVerifyRequest:
      type: object
      required: [code]
      additionalProperties: false
      properties:
        code:
          type: string
          description: The 6-digit code from the user's authenticator app.

    MFADisableRequest:
      type: object
      required: [currentPassword]
      additionalProperties: false
      properties:
        currentPassword:
          type: string
          format: password
          description: |
            The user's current password. Required so that a stolen
            session cookie cannot silently disarm MFA.

    RecoveryCodesBatch:
      type: object
      required: [codes]
      additionalProperties: false
      properties:
        codes:
          type: array
          description: |
            The raw recovery codes. Shown to the user EXACTLY ONCE;
            Lahijan cannot render them again.
          items:
            type: string

    RecoveryCodesListResponse:
      type: object
      required: [total, remaining]
      additionalProperties: false
      properties:
        total:
          type: integer
          description: Total codes the user has (used + unused).
        remaining:
          type: integer
          description: Number of unused codes remaining.
        rows:
          type: array
          description: Optional per-row metadata (no raw codes).
          items:
            type: object
            required: [id, used, createdAt]
            properties:
              id:
                type: string
                format: uuid
              used:
                type: boolean
              createdAt:
                type: string
                format: date-time

    WebAuthnBeginRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          description: Optional user-supplied label for the credential.

    WebAuthnBeginRegistrationResponse:
      type: object
      required: [publicKey, session]
      additionalProperties: false
      properties:
        publicKey:
          type: object
          description: |
            The PublicKeyCredentialCreationOptions the browser feeds to
            navigator.credentials.create(). Opaque to Lahijan.
        session:
          type: string
          description: |
            Opaque ceremony session token the dashboard MUST echo back
            at /finish in the matching field.

    WebAuthnFinishRegistrationRequest:
      type: object
      required: [session, response, name]
      additionalProperties: false
      properties:
        session:
          type: string
          description: The ceremony session returned by /register/begin.
        response:
          description: |
            The raw attestation response the browser POSTed. Carried
            verbatim to the WebAuthn library.
        name:
          type: string
          description: User-supplied label for the credential.

    WebAuthnLoginBeginRequest:
      type: object
      required: [pendingSessionToken]
      additionalProperties: false
      properties:
        pendingSessionToken:
          type: string
          description: The pending_session_token from /login or /oauth/callback.

    WebAuthnLoginBeginResponse:
      type: object
      required: [publicKey, session]
      additionalProperties: false
      properties:
        publicKey:
          type: object
          description: |
            The PublicKeyCredentialRequestOptions the browser feeds to
            navigator.credentials.get().
        session:
          type: string
          description: Opaque ceremony session for /login/finish.

    WebAuthnLoginFinishRequest:
      type: object
      required: [session, response]
      additionalProperties: false
      properties:
        session:
          type: string
        response:
          description: The raw assertion response from the browser.

    MFAChallengeRequest:
      type: object
      required: [pendingSessionToken, kind]
      additionalProperties: false
      properties:
        pendingSessionToken:
          type: string
          description: The token from /login when MFA is required.
        kind:
          type: string
          enum: [totp, recovery, webauthn]
          description: Which factor the user is challenging with.
        code:
          type: string
          description: |
            The 6-digit TOTP code (kind=totp) or the recovery code
            (kind=recovery). Empty when kind=webauthn.
        webauthnSession:
          type: string
          description: |
            The ceremony session from /me/mfa/webauthn/login/begin
            (kind=webauthn only).
        webauthnResponse:
          description: |
            The parsed assertion response from the browser
            (kind=webauthn only).
