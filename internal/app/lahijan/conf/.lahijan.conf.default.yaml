http:
  server:
    # server port to listen
    port: 3000
    # server host to listen
    host: "0.0.0.0"
    # server concurrency
    concurrency: "$go-computed"
    # max body size accepted by server
    bodylimit: "$go-computed"
    # spawn multiple go processes listening on the same port
    prefork: false

    cors:
      # toggles cross-origin resource sharing headers
      enabled: false
      # allowed cors headers
      allowHeaders: [] # !!str
      # allowed cors methods
      allowMethods: [] # !!str
      # allowed cors origins
      allowOrigins: [] # !!str
      # cors max age
      maxAge: 0

    logger:
      # toggles logging requests
      enabled: true
      # toggles colors for logging requests
      colors: true

    healthcheck:
      # toggles readiness and liveness endpoints
      enabled: true
      # readiness endpoint
      readinessEndpoint: "/healthcheck/readiness"
      # liveness endpoint
      livenessEndpoint: "/healthcheck/liveness"

# application environment e.g. dev, stg, prd
environment: dev

# activates more logs and debugging behavior
debug: false

database:
  # database host
  host: "localhost"
  # database port
  port: 5432
  # database name
  name: "lahijan"
  # database user
  user: "lahijan"
  # database password (use env LAHIJAN_DATABASE_PASSWORD in any real env)
  password: ""
  # sslmode: disable, require, verify-ca, verify-full
  sslmode: "disable"
  # maximum number of connections in the pool
  maxConns: 20
  # minimum number of idle connections in the pool
  minConns: 2
  # max lifetime of a connection in seconds
  maxConnLifetimeSeconds: 3600
  # max idle duration of a connection in seconds
  maxConnIdleSeconds: 300
  # statement timeout applied per connection in milliseconds
  statementTimeoutMs: 5000

# Authentication subsystem (WS-06). Every key is overridable via env
# LAHIJAN_AUTH_<PATH> or a config file. The signing key MUST be set in any
# non-dev environment; an empty key falls back to a derived dev value (see
# conf/computeddefault) and is rejected when environment != dev.
auth:
  # argon2id password hashing parameters (OWASP-recommended baseline).
  password:
    argon2:
      # memory in KiB (65536 = 64 MB)
      memory: 65536
      # iterations (time cost)
      iterations: 3
      # parallelism (threads)
      parallelism: 2
      # salt length in bytes
      saltLength: 16
      # derived key length in bytes
      keyLength: 32
    # minimum password length; enforced by auth/password strength check
    minLength: 12
    # opt-in HaveIBeenPwned k-anonymity breach check (off by default for privacy)
    breachCheck:
      enabled: false

  # browser session cookies (opaque, signed, HttpOnly)
  session:
    # cookie name for the access session id
    cookieName: "lahijan_session"
    # cookie name for the rotating refresh token
    refreshCookieName: "lahijan_refresh"
    # cookie domain; empty = the request's host
    domain: ""
    # mark cookies Secure (HTTPS-only). false for local dev, true in prod
    secure: false
    # SameSite attribute: strict | lax | none
    sameSite: "lax"
    # path the cookies apply to
    path: "/"
    # session lifetime in seconds (sliding window)
    lifetimeSeconds: 86400
    # refresh token lifetime in seconds
    refreshLifetimeSeconds: 2592000

  # personal access tokens
  pat:
    # human-readable prefix on every raw PAT (helps users identify them)
    prefix: "lah_pat_"
    # raw token random byte length (before base64 encoding + prefix + checksum)
    byteLength: 32

  # single-use email-link tokens (verify-email, password-reset, email-change)
  email:
    # verify-email link TTL in seconds
    verificationTTLSeconds: 86400
    # password-reset link TTL in seconds
    passwordResetTTLSeconds: 3600
    # email-change link TTL in seconds
    emailChangeTTLSeconds: 86400
    # raw email-token random byte length
    byteLength: 32

  # HMAC key used to sign session cookies and email-link tokens. Leave empty in
  # dev to use a derived value; MUST be set to a high-entropy secret in prod.
  signing:
    key: ""

# SMTP for outgoing auth emails (WS-06). In dev, point this at MailHog
# (see deployments/docker-compose.dev.yml). Disable to drop emails silently
# (useful in tests).
smtp:
  # toggles outbound email delivery. When false, emails are not sent.
  enabled: false
  # SMTP host
  host: "localhost"
  # SMTP port (587 for STARTTLS, 1025 for MailHog)
  port: 1025
  # SMTP username (empty for unauthenticated MailHog)
  user: ""
  # SMTP password (use env LAHIJAN_SMTP_PASSWORD in any real env)
  password: ""
  # From: address on every outgoing email
  from: "noreply@localhost"
  # human-friendly From: name
  fromName: "Lahijan"
  # base URL prepended to email links (verify-email, password-reset). Should be
  # the public dashboard origin, e.g. https://app.example.com
  appBaseURL: "http://localhost:3000"
