http:
  server:
    # server port to listen
    port: 3000
    # server host to listen
    host: "0.0.0.0"
    # server concurrency
    concurrency: "$go-computed"
    # max body size accepted by server
    bodylimit: "$go-computed"
    # spawn multiple go processes listening on the same port
    prefork: false

    cors:
      # toggles cross-origin resource sharing headers
      enabled: false
      # allowed cors headers
      allowHeaders: [] # !!str
      # allowed cors methods
      allowMethods: [] # !!str
      # allowed cors origins
      allowOrigins: [] # !!str
      # cors max age
      maxAge: 0

    logger:
      # toggles logging requests
      enabled: true
      # toggles colors for logging requests
      colors: true

    healthcheck:
      # toggles readiness and liveness endpoints
      enabled: true
      # readiness endpoint
      readinessEndpoint: "/healthcheck/readiness"
      # liveness endpoint
      livenessEndpoint: "/healthcheck/liveness"

# application environment e.g. dev, stg, prd
environment: dev

# activates more logs and debugging behavior
debug: false

database:
  # database host
  host: "localhost"
  # database port
  port: 5432
  # database name
  name: "lahijan"
  # database user
  user: "lahijan"
  # database password (use env LAHIJAN_DATABASE_PASSWORD in any real env)
  password: ""
  # sslmode: disable, require, verify-ca, verify-full
  sslmode: "disable"
  # maximum number of connections in the pool
  maxConns: 20
  # minimum number of idle connections in the pool
  minConns: 2
  # max lifetime of a connection in seconds
  maxConnLifetimeSeconds: 3600
  # max idle duration of a connection in seconds
  maxConnIdleSeconds: 300
  # statement timeout applied per connection in milliseconds
  statementTimeoutMs: 5000

# Authentication subsystem (WS-06). Every key is overridable via env
# LAHIJAN_AUTH_<PATH> or a config file. The signing key MUST be set in any
# non-dev environment; an empty key falls back to a derived dev value (see
# conf/computeddefault) and is rejected when environment != dev.
auth:
  # argon2id password hashing parameters (OWASP-recommended baseline).
  password:
    argon2:
      # memory in KiB (65536 = 64 MB)
      memory: 65536
      # iterations (time cost)
      iterations: 3
      # parallelism (threads)
      parallelism: 2
      # salt length in bytes
      saltLength: 16
      # derived key length in bytes
      keyLength: 32
    # minimum password length; enforced by auth/password strength check
    minLength: 12
    # opt-in HaveIBeenPwned k-anonymity breach check (off by default for privacy)
    breachCheck:
      enabled: false

  # browser session cookies (opaque, signed, HttpOnly)
  session:
    # cookie name for the access session id
    cookieName: "lahijan_session"
    # cookie name for the rotating refresh token
    refreshCookieName: "lahijan_refresh"
    # cookie domain; empty = the request's host
    domain: ""
    # mark cookies Secure (HTTPS-only). false for local dev, true in prod
    secure: false
    # SameSite attribute: strict | lax | none
    sameSite: "lax"
    # path the cookies apply to
    path: "/"
    # session lifetime in seconds (sliding window)
    lifetimeSeconds: 86400
    # refresh token lifetime in seconds
    refreshLifetimeSeconds: 2592000

  # personal access tokens
  pat:
    # human-readable prefix on every raw PAT (helps users identify them)
    prefix: "lah_pat_"
    # raw token random byte length (before base64 encoding + prefix + checksum)
    byteLength: 32

  # single-use email-link tokens (verify-email, password-reset, email-change)
  email:
    # verify-email link TTL in seconds
    verificationTTLSeconds: 86400
    # password-reset link TTL in seconds
    passwordResetTTLSeconds: 3600
    # email-change link TTL in seconds
    emailChangeTTLSeconds: 86400
    # raw email-token random byte length
    byteLength: 32

  # HMAC key used to sign session cookies and email-link tokens. Leave empty in
  # dev to use a derived value; MUST be set to a high-entropy secret in prod.
  signing:
    key: ""

  # AES-256-GCM key (32 raw bytes, base64-encoded) used to encrypt external
  # IdP tokens (OAuth access_token / refresh_token, OIDC id_token) at rest.
  # Leave empty in dev to use a deterministic warning-prefixed value; MUST be
  # set to a high-entropy 32-byte secret in prod. The key is read at startup;
  # rotation is a follow-up WS.
  secrets:
    encryptionKey: ""

  # External identity providers (WS-07a). Every provider is keyed by a stable
  # name ("google", "github", "keycloak"); the key appears in the URL paths
  # /api/v1/auth/oauth/{provider}/start and is stored as the `provider` column
  # on user_oauth_identities.
  #
  # Client IDs / secrets are overridable via env. The OAuth2 authorization-code
  # flow uses PKCE for every provider, including the confidential clients.
  oauth:
    providers:
      google:
        enabled: false
        clientId: ""
        clientSecret: ""
        # scopes requested at token time (openid + email + profile is the
        # minimum needed for account linking)
        scopes: ["openid", "email", "profile"]
      github:
        enabled: false
        clientId: ""
        clientSecret: ""
        scopes: ["read:user", "user:email"]
    # The redirect URL the IdP sends the user back to. The full path is
    # /api/v1/auth/oauth/{provider}/callback; this base is prepended to it.
    # Leave empty in dev to derive from the request Host header (works when
    # the app is reached on localhost).
    redirectBase: ""

  # OpenID Connect providers (WS-07a). Any OIDC-compliant IdP (Keycloak,
  # Auth0, Okta, Google Workspace, ...) is configured here under a stable key.
  # The key is namespaced in user_oauth_identities as "oidc:<key>" so it never
  # collides with the OAuth presets above.
  oidc:
    providers:
      keycloak:
        enabled: false
        issuer: ""              # e.g. https://sso.example.com/realms/main
        clientId: ""
        clientSecret: ""
        scopes: ["openid", "email", "profile"]
    # Same shape as oauth.redirectBase above.
    redirectBase: ""

  # SAML 2.0 service-provider config (WS-07b). Any SAML-compliant IdP
  # (Microsoft Entra / Azure AD, Okta, OneLogin, Shibboleth, Google
  # Workspace SAML) is configured here under a stable key. The key is
  # namespaced in user_saml_identities as "saml:<key>" so it never collides
  # with the OAuth presets above or the OIDC providers.
  saml:
    # PEM-encoded RSA private key the SP uses to sign AuthnRequests + the SP
    # metadata. Leave empty in dev (the bootstrap derives a deterministic
    # warning value); MUST be set in any non-dev environment. Source via env
    # LAHIJAN_AUTH_SAML_SP_SIGNING_KEY or LAHIJAN_AUTH_SAML_SP_SIGNING_KEY_FILE
    # (the file variant is read by the bootstrap so the key never appears in
    # a process-listing-visible arg).
    spSigningKey: ""
    # PEM-encoded x509 certificate matching spSigningKey. Published in the SP
    # metadata so the IdP can verify signed AuthnRequests.
    spSigningCert: ""
    # The base URL the SP advertises for its ACS + metadata endpoints. Leave
    # empty in dev to derive from the request Host header. Should be the
    # public dashboard origin in prod, e.g. https://app.example.com.
    redirectBase: ""
    # Just-in-time user creation: when an unknown (provider, name_id) logs in
    # via SAML, create a fresh user from the IdP-asserted attributes. Default
    # false — production deployments that require admin pre-registration keep
    # this off; homelab / small-team deployments turn it on.
    jit:
      enabled: false
    providers:
      entra:
        enabled: false
        # The SP's entity ID (the value placed in <Issuer> of AuthnRequests
        # and in the SP metadata). Typically the SP's metadata URL.
        entityId: ""
        # Inline IdP metadata XML. When non-empty, idpMetadataURL is ignored.
        # Multi-line YAML strings work here; paste the <EntityDescriptor>...
        # XML the IdP publishes at its metadata endpoint.
        idpMetadataXML: ""
        # IdP metadata URL the SP fetches at startup. Used when the deployer
        # does not want to paste the XML inline; fetched once at bootstrap.
        idpMetadataURL: ""
        # Accept SAML responses that carry no InResponseTo (IdP-initiated
        # SSO). Default false: allowing IdP-initiated without an allow-list
        # of trusted IdPs is a known SAML CSRF vector.
        allowIdpInitiated: false
        # Override the SAML attribute names used to populate the user's email
        # + display name. Empty = use the WS-Federation standard claim URIs
        # that Entra, Okta, and most IdPs use by default.
        emailAttribute: ""
        nameAttribute: ""

  # Multi-factor authentication config (WS-07c). TOTP + recovery codes
  # work out of the box; WebAuthn requires the RPID + RPOrigins to be
  # set to the dashboard's domain so the browser accepts the ceremony.
  mfa:
    # Short-lived, single-use pending session lifetime in seconds. The
    # pending_session_token issued at login (when MFA is required) expires
    # after this many seconds. 300s (5 min) is the OWASP-recommended default.
    pendingTTLSeconds: 300
    # Maximum number of consecutive failed MFA challenges against the same
    # pending session before it is revoked (brute-force lockout). 5 is the
    # sweet spot between user typo tolerance and protection against a
    # 6-digit-code brute force (10^6 / 5 attempts = at most 1.4e-3 chance
    # of guessing one code in 5 tries).
    maxAttempts: 5
    # TOTP parameters. Defaults follow the RFC 6238 + authenticator-app
    # conventions (SHA-1, 30s period, 6 digits, ±1 step skew). The
    # algorithm + secret length are NOT configurable here because every
    # authenticator app the user might pick assumes them.
    totp:
      # Human-readable platform name shown in the authenticator app
      # alongside the account name. Defaults to "Lahijan".
      issuer: "Lahijan"
    # Recovery code parameters. Defaults follow the WS-07c scope: 10 codes
    # per batch, 6 dash-separated groups of 5 base32 characters each.
    recovery:
      # Number of recovery codes per batch. Default 10.
      count: 10
    # WebAuthn relying-party parameters. RPID + RPOrigins MUST be set in
    # any environment where the dashboard is reached on a real domain
    # (i.e. anything but localhost dev). Leave empty in dev to disable
    # WebAuthn entirely (the api handler returns "feature disabled").
    webauthn:
      # Relying-party id (registrable domain, e.g. "app.example.com").
      # MUST match the dashboard's domain or a registrable parent of it.
      rpId: ""
      # Display name shown in the browser prompt ("Lahijan" by default).
      rpDisplayName: "Lahijan"
      # List of permitted origins (full scheme + host + optional port).
      # MUST include the dashboard's origin (e.g. https://app.example.com).
      rpOrigins: []
      # Optional list of permitted top origins for Level 3 cross-iframe
      # flows. Leave empty to disable top-origin verification.
      rpTopOrigins: []

# SMTP for outgoing auth emails (WS-06). In dev, point this at MailHog
# (see deployments/docker-compose.dev.yml). Disable to drop emails silently
# (useful in tests).
smtp:
  # toggles outbound email delivery. When false, emails are not sent.
  enabled: false
  # SMTP host
  host: "localhost"
  # SMTP port (587 for STARTTLS, 1025 for MailHog)
  port: 1025
  # SMTP username (empty for unauthenticated MailHog)
  user: ""
  # SMTP password (use env LAHIJAN_SMTP_PASSWORD in any real env)
  password: ""
  # From: address on every outgoing email
  from: "noreply@localhost"
  # human-friendly From: name
  fromName: "Lahijan"
  # base URL prepended to email links (verify-email, password-reset). Should be
  # the public dashboard origin, e.g. https://app.example.com
  appBaseURL: "http://localhost:3000"

# Durable job queue (WS-09). Wraps River (chosen in ADR-0008); every async
# task in Lahijan goes through this queue. Disable for dev / test runs that
# do not need a queue; the admin jobs API degrades to 501 in that case.
jobs:
  # toggles the durable job queue. When false, the River client + supervisor
  # are NOT built and the admin jobs API returns 501.
  enabled: false
  # default retry budget for jobs that do not pin their own MaxAttempts.
  # 5 matches River upstream.
  maxAttempts: 5
  # default per-job wall-clock timeout, in seconds. A worker can override
  # this via its Timeout() method.
  jobTimeoutSeconds: 60
  # graceful shutdown window in seconds: how long the supervisor waits for
  # in-flight jobs to finish during a soft stop before escalating to a hard
  # cancel.
  softStopTimeoutSeconds: 30
  # per-queue MaxWorkers when the queue is not explicitly listed in queues.*.
  # 10 is a small-host-friendly default; production should raise it.
  defaultMaxWorkersPerQueue: 10
  # poll-only mode disables LISTEN/NOTIFY and falls back to periodic polling
  # for new jobs. Set to true behind PgBouncer transaction pooling.
  pollOnly: false
  # per-queue MaxWorkers overrides. Keys are queue names; values are the
  # max in-flight workers. Empty means "use defaultMaxWorkersPerQueue for
  # every queue derived from the registry".
  queues: {}
  # admin web UI (River's built-in SPA). Mounted at adminUI.path and gated
  # by platform.jobs.read. The UI ships its own REST API under the same
  # prefix; the same Fiber-level auth applies.
  adminUI:
    enabled: true
    path: "/admin/jobs/ui"

# WASM plugin subsystem (WS-10a/b/c). When disabled, the admin plugin API
# degrades to a 501 "feature disabled" envelope and the wazero runtime is NOT
# built. The DB tables (plugins, plugin_permissions) still exist so a future
# enable does not require a migration; the runtime is the only piece that
# short-circuits. Per ADR-0012 every plugin runs inside a wazero sandbox with
# per-call memory + time limits; the values below are the process-wide caps.
# A specific plugin's effective limits are the SMALLER of these and anything
# the plugin's manifest declares.
wasm:
  # toggles the WASM subsystem. When false, the admin plugin API returns 501
  # and program.Start does not build the wazero runtime.
  enabled: false
  # max memory bytes a single plugin instance can allocate. The runtime
  # rejects instantiation of a module whose declared memory max exceeds this.
  # 32 MiB covers every sample plugin in WS-10c while leaving headroom for
  # many concurrent instances on a small host.
  maxMemoryPerPlugin: 33554432
  # max wall-clock milliseconds a single host call into a plugin may take
  # before the runtime cancels the context. The plugin receives a
  # context.DeadlineExceeded-compatible error; long-running work belongs on
  # the River queue (WS-09), not in a synchronous host call.
  execTimeoutMs: 5000
  # max size in bytes of an uploaded .wasm module. The admin upload endpoint
  # rejects anything larger at the multipart boundary so a malicious admin
  # cannot exhaust server memory.
  maxModuleSize: 10485760
  # Marketplace (WS-10c). The admin marketplace API reads the index from
  # either `path` (a local directory) or `url` (an HTTP endpoint serving the
  # same YAML). When both are set, `url` wins. When neither is set, the
  # marketplace endpoints degrade to 501 "feature disabled". The default
  # in-repo marketplace lives at examples/plugins/marketplace/.
  marketplace:
    # Local directory rooted at the Lahijan working dir. The directory must
    # contain plugins-marketplace.yaml at its top level. Defaults to the
    # in-repo marketplace shipped with Lahijan.
    path: "examples/plugins/marketplace"
    # Remote HTTP(S) endpoint serving plugins-marketplace.yaml. When non-
    # empty, takes precedence over `path`.
    url: ""
    # Cache lifetime (seconds) for the parsed index. The local loader also
    # watches the file's mtime and re-reads on change; the HTTP loader only
    # re-fetches on TTL expiry.
    cacheTtlSeconds: 60

# Infrastructure providers (WS-11..13). Each driver is wired ONLY when its
# top-level `enabled` flag is true; otherwise program.Start skips building the
# driver and the consuming module degrades to 501 "feature disabled" envelopes.
# Per ADR-0025 the Incus driver is a thin internal REST client over the Incus
# REST API (no upstream SDK dependency).
providers:
  # Incus compute backend (WS-11). In dev the daemon lives on the host; the
  # Lahijan app talks to it over the Unix socket at socketPath. In prod the
  # incus-client sidecar container mounts the host socket (see
  # deployments/incus/preseed.yaml).
  incus:
    # toggles the Incus driver. When false, program.Start skips building it
    # and the compute module (WS-14) degrades to 501.
    enabled: false
    # Unix socket path to the Incus daemon. Empty disables Unix-socket mode
    # and the driver uses remoteURL (HTTPS) instead.
    socketPath: "/var/snap/incus/common/incus/unix.socket"
    # Optional HTTPS remote Incus endpoint (e.g. https://incus.lan:8443).
    # Empty in dev (Unix socket wins). Set this + clientCert/clientKey for
    # remote-daemon deployments.
    remoteURL: ""
    # Per-request timeout in seconds for Incus REST calls. Long-running
    # operations (image copy, snapshot) use an async wait via the operations
    # endpoint instead of a long blocking HTTP call.
    requestTimeoutSeconds: 30
    # Tenant -> Incus project name prefix. The full project name is
    # "<prefix><tenant-uuid>". The default "lahijan-tenant-" matches ADR-0010.
    projectPrefix: "lahijan-tenant-"
    # Project features turned on at tenant bootstrap. See Incus docs on
    # "Projects" — these flags isolate images, profiles, networks, and
    # storage objects per tenant inside the Incus daemon.
    projectFeatures:
      images: true
      profiles: true
      networks: true
      storageVolumes: true
      storageBuckets: true
    # Featured image aliases advertised by the compute module's image catalog
    # (WS-14). These are the images Incus is expected to have available via
    # its image server; Lahijan does not host them itself.
    featuredImages:
      - "ubuntu/24.04"
      - "debian/12"
      - "alpine/3.20"
      - "fedora/40"
    # Events stream (websocket /1.0/events). When enabled, the driver opens
    # a long-lived websocket to Incus and fans events into the WASM event
    # bus (see internal/app/lahijan/wasm/eventbus). Disable for dev runs
    # that do not have a real daemon (the driver then skips the listener).
    events:
      enabled: true
      # backoff cap between reconnect attempts (seconds). The driver uses
      # exponential backoff with jitter; this is the upper bound.
      maxReconnectSeconds: 30
      # maximum event payload bytes accepted from the daemon. Larger events
      # are dropped (with a warn log) to prevent a misbehaving daemon from
      # exhausting process memory.
      maxPayloadBytes: 1048576
    # mTLS material for HTTPS remote Incus. All four are PEM-encoded. Leave
    # empty for Unix-socket mode (the daemon trusts the local uid).
    tls:
      serverCert: ""
      clientCert: ""
      clientKey: ""
      # set to true to skip server cert verification (dev only; never true
      # in prod). Used when pointing at a daemon with a self-signed cert.
      insecureSkipVerify: false

  # PowerDNS Authoritative backend (WS-12). The daemon runs in a container
  # pointed at the shared Postgres gpgsql backend (ADR-0007). Lahijan talks
  # to the daemon's HTTP API over the local compose network. The API key
  # MUST be set via env LAHIJAN_PROVIDERS_POWERDNS_API_KEY in any non-dev
  # environment; an empty key falls back to a derived dev value and the
  # driver fails fast.
  powerdns:
    # toggles the PowerDNS driver. When false, program.Start skips building
    # it and the dns module (WS-15) degrades to 501.
    enabled: false
    # Base URL of the PDNS HTTP API. The default targets the compose
    # service on the internal port (8081) — point this at a remote PDNS
    # for non-compose deploys.
    baseURL: "http://powerdns:8081"
    # API key the daemon expects in the X-API-Key header. Sourced from env
    # LAHIJAN_PROVIDERS_POWERDNS_API_KEY; never commit a real value.
    apiKey: ""
    # Per-request timeout in seconds for PDNS HTTP calls. PDNS zone writes
    # return quickly (sub-second); 30s is a generous ceiling for slow
    # disks.
    requestTimeoutSeconds: 30
    # Default NS targets written into the SOA + NS RRsets at zone-create
    # time. The first entry is the primary; the rest are secondaries. Each
    # must be a canonical name (the driver appends a trailing dot if
    # missing).
    defaultNameservers:
      - "ns1.lahijan.local."
    # Default DNSSEC policy for new zones per WS-12 "Open questions" item
    # 1: off by default; the admin opts in per zone via the DNS service.
    # When true, EnableDNSSEC runs at zone-create time.
    defaultDNSSECEnabled: false
    # Default AXFR policy per WS-12 "Open questions" item 2: Lahijan is
    # the only NS by default. When true, ALLOW-AXFR-FROM is seeded with
    # defaultAXFRFrom at zone-create time.
    defaultAXFREnabled: false
    # When defaultAXFREnabled is true, these IPs/CIDRs are written into
    # ALLOW-AXFR-FROM. Empty when AXFR is off.
    defaultAXFRFrom: []
    # Events synthesis (WS-12). When enabled, every mutating driver call
    # emits a BusEvent into the WASM event bus so plugins subscribed to
    # "dns.zone.*" / "dns.record.*" see a uniform stream. PDNS itself
    # does NOT push events. Disable for dev runs that do not have a WASM
    # bus attached.
    events:
      enabled: true

  # SeaweedFS object storage backend (WS-13). Dev runs `weed mini` (one
  # process) inside the compose stack; prod runs the master/volume/filer/s3
  # split. The Filer stores metadata in the shared Postgres `seaweed` DB
  # (ADR-0007); the S3 server is the data plane users hit directly with
  # per-user credentials Lahijan mints. Per ADR-0011 the control plane
  # (buckets, credentials, quotas) goes through Lahijan; the data plane
  # (PUT/GET objects) goes direct from the user's S3 client to SeaweedFS.
  seaweedfs:
    # toggles the SeaweedFS driver. When false, program.Start skips
    # building it and the storage module (WS-16) degrades to 501.
    enabled: false
    # S3 endpoint URL the AWS SDK client targets. The default targets the
    # compose service on the internal S3 port (8333). For path-style
    # addressing (SeaweedFS does not support virtual-hosted style), set
    # usePathStyle=true (the default).
    s3Endpoint: "http://seaweedfs:8333"
    # toggles path-style S3 addressing (https://<host>/<bucket>/...).
    # SeaweedFS requires path-style; setting this false breaks the driver.
    usePathStyle: true
    # AWS region the SDK presents on every request. SeaweedFS ignores the
    # region for auth purposes but the SDK requires a non-empty value;
    # "us-east-1" is the AWS-canonical default.
    region: "us-east-1"
    # admin access key the SeaweedFS S3 server recognises as the root
    # account. Sourced from env LAHIJAN_PROVIDERS_SEAWEEDFS_ADMIN_ACCESS_KEY;
    # never commit a real value. The same value MUST match the
    # SEAWEEDFS_S3_ACCESS_KEY env var the compose stack hands to the
    # `weed s3` container.
    adminAccessKey: ""
    # admin secret key paired with adminAccessKey. SENSITIVE — never logged.
    # Sourced from env LAHIJAN_PROVIDERS_SEAWEEDFS_ADMIN_SECRET_KEY.
    adminSecretKey: ""
    # Filer HTTP API origin the driver uses for Filer metadata + IAM
    # writes. Default targets the compose service on the internal Filer
    # port (8888).
    filerURL: "http://seaweedfs:8888"
    # Per-request timeout in seconds for S3 + Filer HTTP calls.
    requestTimeoutSeconds: 30
    # Default TTL (seconds) for pre-signed URLs when the caller does not
    # override it. 3600 (1 hour) is the AWS-recommended ceiling.
    defaultPresignTTLSeconds: 3600
    # Default per-bucket quota in mebibytes applied at bucket-create time
    # when the caller does not override it. 0 means "no backend-side
    # quota" (Lahijan enforces quotas in its metering layer instead).
    defaultQuotaMiB: 0
    # Events synthesis (WS-13). When enabled, every mutating driver call
    # emits a BusEvent into the WASM event bus so plugins subscribed to
    # "storage.bucket.*" / "storage.credential.*" see a uniform stream.
    # SeaweedFS does NOT push events. Disable for dev runs that do not
    # have a WASM bus attached.
    events:
      enabled: true
