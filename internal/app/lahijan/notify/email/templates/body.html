<!DOCTYPE html>
<html lang="{{if .LocaleHint}}{{.LocaleHint}}{{else}}en{{end}}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lahijan</title>
  </head>
  <body style="margin:0;padding:0;background:#f6f7f9;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1f2933;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f7f9;padding:24px 0;">
      <tr>
        <td align="center">
          <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:8px;padding:32px 40px;box-shadow:0 1px 3px rgba(15,23,42,0.08);">
            <tr>
              <td>
                <h1 style="margin:0 0 16px 0;font-size:20px;font-weight:600;color:#0f172a;">Lahijan</h1>
                {{if .Greeting}}<p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#334155;">{{.Greeting}}</p>{{end}}
                <p style="margin:0 0 24px 0;font-size:15px;line-height:1.6;color:#334155;white-space:pre-wrap;">{{.Body}}</p>
                {{if .CTALink}}
                <p style="margin:0 0 24px 0;">
                  <a href="{{.CTALink}}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;font-size:15px;font-weight:600;padding:12px 24px;border-radius:6px;">{{.CTALabel}}</a>
                </p>
                {{end}}
                <p style="margin:0;font-size:13px;line-height:1.6;color:#64748b;">{{.Signature}}</p>
              </td>
            </tr>
          </table>
          <p style="margin:16px 0 0 0;font-size:12px;color:#94a3b8;">Lahijan Cloud Platform</p>
        </td>
      </tr>
    </table>
  </body>
</html>
