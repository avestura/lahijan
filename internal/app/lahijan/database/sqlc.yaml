# sqlc configuration for Lahijan.
#
# Docs: https://docs.sqlc.dev/en/latest/reference/config.html
#
# Codegen: one Go package (`gen`) holding the type-safe query types and the
# `Querier` interface. The schema is sourced from the golang-migrate `*.up.sql`
# files only (via a glob) so the `*.down.sql` rollback files are not parsed.
# Repository wrappers in `database/<area>_repo.go` implement/extend the
# generated Querier and are the only sanctioned way for services to reach the
# DB (see ADR-0002, ADR-0003, and .opencode/skills/database-conventions).
#
# Run `make sqlc` (or `sqlc generate` in this dir) to regenerate.

version: "2"

sql:
  - engine: "postgresql"
    queries:
      - "queries/tenants.sql"
      - "queries/users.sql"
      - "queries/rbac.sql"
      - "queries/memberships.sql"
      - "queries/audit_log.sql"
      - "queries/tokens.sql"
      - "queries/sessions.sql"
      - "queries/email_tokens.sql"
      - "queries/oauth_identities.sql"
      - "queries/saml_identities.sql"
      - "queries/totp_secrets.sql"
      - "queries/webauthn_credentials.sql"
      - "queries/recovery_codes.sql"
      - "queries/mfa_pending_sessions.sql"
      - "queries/plugins.sql"
      - "queries/plugin_kv.sql"
      - "queries/plugin_config.sql"
      - "queries/plugin_event_subscriptions.sql"
      - "queries/plugin_http_handlers.sql"
      - "queries/dns_zones.sql"
    schema:
      - "migrations/*.up.sql"
    gen:
      go:
        package: gen
        out: gen
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        emit_interface: true
        emit_empty_slices: true
        emit_exact_table_names: false
        overrides:
          - db_type: "uuid"
            go_type: "github.com/google/uuid.UUID"
          - db_type: "uuid"
            nullable: true
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
              pointer: true
          - db_type: "timestamptz"
            go_type:
              import: "time"
              type: "Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              import: "time"
              type: "Time"
              pointer: true
          - db_type: "jsonb"
            go_type:
              import: "encoding/json"
              type: "RawMessage"
          - db_type: "inet"
            nullable: true
            go_type:
              import: "net/netip"
              type: "Addr"
              pointer: true

# `sqlc verify` will be wired in once a second query set lands; for now there's
# only one database target.
