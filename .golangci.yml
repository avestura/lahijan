version: "2"

output:
  formats:
    code-climate:
      path: stdout
    text:
      print-linter-name: true
      print-issued-lines: true
      colors: true

run:
  timeout: 10m
  modules-download-mode: "mod"
  tests: true
  issues-exit-code: 1

severity:
  default: minor
  rules:
    - linters:
        - errcheck
        - gosimple
        - govet
        - ineffassign
        - staticcheck
      severity: critical

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - lll
    - prealloc
    - predeclared
    - gocheckcompilerdirectives
    - goprintffuncname
    - gosec
    - interfacebloat
    - nakedret
    - containedctx
    - durationcheck
    - errname
    - errorlint
    - exhaustive
    - mirror
    - nilerr
    - nilnil
    - perfsprint
    - protogetter
    - reassign
    - rowserrcheck
    - unconvert
    - wastedassign
  settings:
    staticcheck:
      checks: ["all"]
    errcheck:
      check-type-assertions: true
      check-blank: false
    govet:
      enable:
        - shadow
    predeclared:
      qualified-name: true
    gosec:
      severity: high
      confidence: high
      includes:
        - G101
        - G109
        - G115
        - G201
        - G202
        - G203
        - G204
        - G303
        - G404
        - G501
        - G505
        - G601
        - G602
    interfacebloat:
      max: 7
    nakedret:
      max-func-lines: 30
    exhaustive:
      check:
        - switch
        - map
      default-signifies-exhaustive: true
    protogetter:
      skip-any-generated: true
    lll:
      line-length: 150
  exclusions:
    presets:
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - "vendor$"
      - "_test\\.go$"
      - "third_party$"
      - "testdata$"
      - "examples$"
      # Frontend node_modules may ship .go files (e.g. flatted); ignore them.
      - "node_modules"
    rules:
      - linters: [lll]
        path: ".*\\.md$"

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/avestura/lahijan
      extra-rules: true
