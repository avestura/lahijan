# PowerDNS Authoritative config for the Lahijan dev compose stack.
#
# The official powerdns/pdns-auth-49 image does NOT translate arbitrary
# PDNS_* env vars into pdns.conf (its startup script only honours
# PDNS_AUTH_API_KEY for the API fragment; gpgsql_* / launch / webserver-*
# env vars are silently ignored). Mounting this file at
# /etc/powerdns/pdns.conf is the single source of truth for the dev stack.
#
# Dev values are fixed (shared Postgres, known API key) so a static file is
# fine here. For non-compose deployments (bare-metal / prod) render
# pdns.conf.template with envsubst instead — that file carries the same
# settings but reads them from PDNS_* env.
#
# Validated against pdns-auth-49:4.9.3:
#   - `default-soa-edit-api` was removed; per-zone SOA-EDIT-API still works
#     via the API's soa_edit_api field at zone-create time.
#   - `webserver-loglevel` takes a named level (none|normal|detailed), not a
#     numeric 0-9.

# --- gpgsql backend (ADR-0007: shared Postgres, logical DB "pdns") ---
launch=gpgsql
gpgsql-host=postgres
gpgsql-port=5432
gpgsql-dbname=pdns
gpgsql-user=pdns
gpgsql-password=pdns

# --- HTTP API + webserver (the Lahijan driver talks to this) ---
api=yes
api-key=lahijan-dev-pdns-key
webserver=yes
webserver-address=0.0.0.0
webserver-port=8081
webserver-allow-from=0.0.0.0/0,::/0
webserver-loglevel=normal

# --- Authoritative DNS listener ---
local-address=0.0.0.0,::
local-port=53

# --- Disable PDNS' own dnsupdate (RFC 2136); Lahijan is the only writer ---
dnsupdate=no

# --- Allow include-dir fragments (kept for parity with the image base) ---
include-dir=/etc/powerdns/pdns.d
