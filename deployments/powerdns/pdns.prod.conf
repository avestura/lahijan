# PowerDNS Authoritative base config for the prod compose stack (WS-23).
#
# The official powerdns/pdns-auth-49 image ignores arbitrary PDNS_* env vars
# (see pdns.dev.conf). This file replaces the image's gsqlite3 default and
# only pulls in /etc/powerdns/pdns.d, where the image's startup script
# renders templates.d/lahijan.j2 from the container env (TEMPLATE_FILES).
# That keeps every secret in .env.prod rather than in a tracked file.
include-dir=/etc/powerdns/pdns.d
