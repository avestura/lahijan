# Lahijan — Incus preseed template.
#
# Applied at first boot by `incus admin init --auto --config ...` (or via
# `incus admin init --preseed < this-file`). The shape is the official Incus
# preseed YAML; values are templated at startup with the env vars listed in
# deployments/.env.example.
#
# Per ADR-0040 the Incus daemon runs inside the privileged `incus` service
# in the compose stack (image ghcr.io/cmspam/incus-docker:lts). Apply this
# preseed FROM INSIDE the container, not on the host:
#
#   # dev stack
#   docker compose -f deployments/docker-compose.dev.yml exec incus \
#     incus admin init --preseed < /dev/stdin < deployments/incus/preseed.yaml
#
#   # prod stack
#   docker compose -f deployments/docker-compose.prod.yml exec incus \
#     incus admin init --preseed < /dev/stdin < deployments/incus/preseed.yaml
#
# Defaults match the single-host topology in ADR-0005: a single daemon, no
# clustering, a dir-backed storage pool, and a managed bridge network.
#
# Per ADR-0010 every Lahijan tenant maps to its own Incus project; the
# projects themselves are created at tenant-bootstrap time, not here. The
# preseed only sets up the cluster-wide primitives.

config:
  # Core images server — the official Incus image hub. Tenants' instances are
  # built from aliases served from here ("ubuntu/24.04", "debian/12", ...).
  images.auto_update_interval: "6"

# Networks are cluster-wide primitives. The "lahijanbr" bridge is the default
# network every tenant project's instances attach to (via a profile device).
# Tenants with features.networks=true can additionally create their own
# project-scoped networks.
networks:
  - name: lahijanbr
    type: bridge
    config:
      ipv4.address: 10.10.10.1/24
      ipv4.nat: "true"
      ipv6.address: none

# Storage pools are cluster-wide. The default pool ("default") is dir-backed
# for the simplest possible single-host deploy; prod deployments typically
# swap this for zfs or btrfs via the operator install script.
storage_pools:
  - name: default
    driver: dir
    config: {}

# Profiles are global (not project-scoped) until features.profiles=true is
# set on a project. The default profile is only a fallback; per-tenant
# profiles are created at tenant-bootstrap time by the compute module (WS-14).
profiles:
  - name: default
    description: "Lahijan fallback profile (do not use directly)"
    config:
      # Conservative defaults; tenants override via their own profiles.
      limits.cpu: "1"
      limits.memory: "512MiB"
    devices:
      root:
        type: disk
        path: /
        pool: default
      eth0:
        type: nic
        # `network` alone attaches to the managed bridge; Incus rejects
        # nictype/parent alongside it.
        network: lahijanbr

# Projects are NOT created here. Each tenant's project is created at tenant
# bootstrap by the compute module via the Incus driver's EnsureProject. See
# internal/app/lahijan/providers/incus/projects.go.
projects: []
