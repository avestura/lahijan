# Lahijan — development Docker Compose stack.
#
# Brings up the shared Postgres instance described in ADR-0007 (one container,
# three logical databases: lahijan, pdns, seaweed). This file is the dev
# topology; WS-11/12/13 will append Incus-client, PowerDNS, SeaweedFS and the
# OTel collector services here as they land. WS-03 stands up only Postgres.
#
# Usage:
#   make dev-up        # docker compose -f deployments/docker-compose.dev.yml up -d
#   make dev-down
#   make db-up         # apply migrations (after dev-up)
#
# Copy deployments/.env.example to deployments/.env (or repository-root .env)
# before running. .env is gitignored.

name: lahijan-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: lahijan-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres}
      # The default DB that the superuser lands in; Lahijan/PDNS/SeaweedFS
      # each get their own DB + role via the init script below.
      POSTGRES_DB: ${POSTGRES_SUPERUSER_DB:-postgres}
      LAHIJAN_DB_NAME: ${LAHIJAN_DATABASE_NAME:-lahijan}
      LAHIJAN_DB_USER: ${LAHIJAN_DATABASE_USER:-lahijan}
      LAHIJAN_DB_PASSWORD: ${LAHIJAN_DATABASE_PASSWORD:-lahijan}
      PDNS_DB_NAME: ${PDNS_DATABASE_NAME:-pdns}
      PDNS_DB_USER: ${PDNS_DATABASE_USER:-pdns}
      PDNS_DB_PASSWORD: ${PDNS_DATABASE_PASSWORD:-pdns}
      SEAWEED_DB_NAME: ${SEAWEED_DATABASE_NAME:-seaweed}
      SEAWEED_DB_USER: ${SEAWEED_DATABASE_USER:-seaweed}
      SEAWEED_DB_PASSWORD: ${SEAWEED_DATABASE_PASSWORD:-seaweed}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      # PDNS schema (WS-12). The init.sh wrapper runs psql --dbname=pdns
      # against schema.pgsql.sql on first boot only.
      - ./powerdns/init.sh:/docker-entrypoint-initdb.d/02-pdns-schema.sh:ro
      - ./powerdns/schema.pgsql.sql:/powerdns/schema.pgsql.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    shm_size: 256m

  # MailHog: an in-process SMTP catch-all for outbound auth emails (WS-06).
  # Point conf.smtp.host/port at this service and browse http://localhost:8025
  # to inspect verification + password-reset emails during local dev.
  # Not shipped in the prod stack.
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: lahijan-mailhog-dev
    restart: unless-stopped
    ports:
      # SMTP port the app sends to (conf.smtp.port).
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      # Web UI for inspecting captured mail.
      - "${MAILHOG_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # Incus client sidecar (WS-11). In dev Lahijan runs on the host and connects
  # to the host's Incus socket directly, so this service is gated behind a
  # compose profile and only brought up when an operator wants to validate the
  # prod-style mount from inside a container. Enable with:
  #   docker compose --profile incus up -d
  # The host MUST have Incus installed and the socket at INCUS_SOCKET_PATH.
  incus-client:
    image: ghcr.io/lxc/incus:6.0
    container_name: lahijan-incus-client-dev
    profiles: ["incus"]
    restart: unless-stopped
    volumes:
      # Mount the host's Incus socket dir read-only. The Lahijan container
      # (when run under compose) bind-mounts the same path.
      - "${INCUS_SOCKET_PATH:-/var/lib/incus}:/var/lib/incus:ro"
    command: ["sleep", "infinity"]
    healthcheck:
      test: ["CMD", "test", "-S", "/var/lib/incus/unix.socket"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s

  # PowerDNS Authoritative (WS-12). The daemon runs in a container and uses
  # the gpgsql backend pointing at the shared Postgres (ADR-0007). The PDNS
  # schema is applied via the init script in deployments/powerdns/init.sql
  # (sourced upstream from PDNS' schema.pgsql.sql). The API key is read
  # from env LAHIJAN_PROVIDERS_POWERDNS_API_KEY (or PDNS_API_KEY for short)
  # and templated into pdns.conf at startup via envsubst.
  powerdns:
    image: powerdns/pdns-auth-49:4.9.3
    container_name: lahijan-powerdns-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The init.sh on the postgres container created the pdns database +
      # user. PDNS only needs to know how to connect.
      PDNS_gpgsql_host: postgres
      PDNS_gpgsql_user: ${PDNS_DATABASE_USER:-pdns}
      PDNS_gpgsql_password: ${PDNS_DATABASE_PASSWORD:-pdns}
      PDNS_gpgsql_dbname: ${PDNS_DATABASE_NAME:-pdns}
      PDNS_gpgsql_port: 5432
      # API + web server (the HTTP API the Lahijan driver talks to).
      PDNS_api: "yes"
      PDNS_webserver: "yes"
      PDNS_webserver_address: "0.0.0.0"
      PDNS_webserver_port: "8081"
      PDNS_webserver_allow_from: "0.0.0.0/0,::/0"
      PDNS_api_key: ${PDNS_API_KEY:-lahijan-dev-pdns-key}
      # The Lahijan driver always uses /api/v1; PDNS' webserver logs echo
      # this so we can tell driver traffic apart from other clients.
      PDNS_webserver_loglevel: "9"
      # Default SOA-EDIT-API policy applied to every zone Lahijan creates.
      PDNS_default_soa_edit_api: "DEFAULT"
      # Disable PDNS' own dnsupdate (RFC 2136) endpoint; Lahijan is the
      # only writer.
      PDNS_dnsupdate: "no"
    ports:
      # HTTP API the Lahijan driver talks to (conf.providers.powerdns.baseURL).
      - "${PDNS_API_PORT:-8081}:8081"
      # Authoritative DNS port (UDP + TCP). Exposed so the operator can
      # `dig @localhost` against PDNS during dev.
      - "${PDNS_DNS_PORT:-5300}:53/udp"
      - "${PDNS_DNS_PORT:-5300}:53/tcp"
    volumes:
      # The PDNS daemon reads its config from env vars (PDNS_*) when run
      # under the official docker image. For non-compose deployments the
      # pdns.conf.template next to this file is the reference config —
      # render it with envsubst to produce a pdns.conf the bare-metal
      # binary can read.
      - ./powerdns/pdns.conf.template:/etc/powerdns/pdns.conf.template:ro
    healthcheck:
      # PDNS does not ship a healthcheck binary; use the HTTP API as the
      # liveness probe. The api endpoint returns 401 without a key but the
      # TCP connect itself proves the daemon is up + the API is listening.
      # The alpine-based PDNS image ships wget (not curl), so we use it.
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 --timeout=3 http://localhost:8081/api/v1/servers/localhost || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  # SeaweedFS object storage (WS-13). In dev the stack runs `weed mini`
  # (single process) so the deploy is one container and one volume. The
  # Filer is configured to store metadata in the shared Postgres `seaweed`
  # logical DB (ADR-0007); the S3 server reads its admin credentials from
  # the mounted s3.json (which carries the dev defaults baked in) and
  # picks up per-user IAM identities the driver writes via the Filer.
  #
  # In prod the topology splits into master + volume + filer + s3 containers
  # (still in one compose stack); WS-23 will land the prod split. The dev
  # topology is functionally equivalent for every code path the driver
  # exercises — the only difference is HA.
  seaweedfs:
    image: chrislusf/seaweedfs:3.61
    container_name: lahijan-seaweedfs-dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - "mini"
      # Bind on the compose service name so siblings + the host can reach.
      - "-ip=seaweedfs"
      # Turn on the S3 subsystem with the mounted config; the S3 admin
      # identity lives in /etc/seaweedfs/s3.json.
      - "-s3"
      - "-s3.config=/etc/seaweedfs/s3.json"
      # Filer listens on 8888 + stores metadata in the shared Postgres
      # `seaweed` database (ADR-0007).
      - "-filer=true"
      # Postgres-backed Filer store. SeaweedFS reads PG_* / WEED_*
      # env vars; we pass the connection via -filer.postgres.* flags
      # below so the same env shape works in dev + prod.
      - "-filer.postgres"
      - "-filer.postgres.hostname=postgres"
      - "-filer.postgres.port=5432"
      - "-filer.postgres.database=${SEAWEED_DATABASE_NAME:-seaweed}"
      - "-filer.postgres.username=${SEAWEED_DATABASE_USER:-seaweed}"
      - "-filer.postgres.password=${SEAWEED_DATABASE_PASSWORD:-seaweed}"
      # Pinned ports (master 9333, volume 8080, filer 8888, s3 8333).
      - "-master.port=9333"
      - "-volume.port=8080"
      - "-filer.port=8888"
      - "-s3.port=8333"
      # Disable SSL for dev; the Lahijan app + the S3 client talk plain
      # HTTP inside the compose network. WS-23 will flip TLS on for prod.
      - "-volume.publicUrl=http://seaweedfs:8080"
    environment:
      # Admin S3 credentials the Lahijan driver sends. MUST match the
      # access_key / secret_key in deployments/seaweedfs/s3.json. Used
      # by the Lahijan driver; the S3 server itself reads them from the
      # mounted s3.json (we don't envsubst the JSON because Docker
      # volume mounts are read post-envsubst only with custom images).
      SEAWEEDFS_S3_ACCESS_KEY: ${SEAWEEDFS_S3_ACCESS_KEY:-lahijan_dev_admin_key}
      SEAWEEDFS_S3_SECRET_KEY: ${SEAWEEDFS_S3_SECRET_KEY:-lahijan_dev_admin_secret}
    ports:
      # S3 endpoint users hit directly (data plane).
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
      # Filer HTTP API the Lahijan driver talks to (control plane).
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      # Master + volume (admin / debugging; not used by Lahijan but
      # documented here so the operator can reach the SeaweedFS UI).
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_VOLUME_PORT:-8080}:8080"
    volumes:
      # Per-bucket + identity + quota metadata lives under /etc/seaweedfs
      # in the container; mounting it on a named volume preserves it
      # across `docker compose down` cycles.
      - seaweedfs_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The SeaweedFS image ships wget (alpine-based); probe the Filer
      # root status endpoint.
      test: ["CMD-SHELL", "wget -q -O /dev/null --tries=1 --timeout=3 http://localhost:8888/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

volumes:
  postgres_data:
    name: lahijan-postgres-data-dev
  seaweedfs_data:
    name: lahijan-seaweedfs-data-dev
