name: Feature request
description: Propose a new feature or enhancement
title: "feat: <short summary>"
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the proposal! Please link to the relevant workstream
        (see `docs/workstreams/`) if your idea maps to one.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What's currently hard or impossible to do?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would "done" look like from a user's perspective?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about and why they fall short.

  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - compute (Incus)
        - dns (PowerDNS)
        - object-storage (SeaweedFS)
        - auth / RBAC
        - billing / metering
        - plugins (WASM)
        - api / openapi
        - web (dashboard)
        - website (marketing)
        - docs
        - ci / build
        - other
    validations:
      required: true

  - type: input
    id: workstream
    attributes:
      label: Related workstream (if any)
      description: WS ID, e.g. WS-11. See docs/workstreams/README.md.
      placeholder: "WS-XX"
