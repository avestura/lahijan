# Lahijan frontend CI - dashboard SPA (web/) and marketing SPA (website/)
#
# Runs on every push to main and on every PR that touches either SPA or
# the OpenAPI spec. The pipeline is:
#
#   install -> lint -> typecheck -> test -> build
#                             \-> i18n locale sync check
#                             \-> openapi-fetch schema sync check (web only)
#
# A failure on any step blocks merge. The bundle-size check is informational
# for now (printed as a build artefact summary).

name: Frontend

on:
  push:
    branches: [main]
    paths:
      - web/**
      - website/**
      - api/openapi.yaml
      - api/gen/ts/**
      - api/gen/ts-client/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - web/**
      - website/**
      - api/openapi.yaml
      - api/gen/ts/**
      - api/gen/ts-client/**
      - .github/workflows/frontend.yml

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # Dashboard SPA (web/)
  # --------------------------------------------------------------------------
  web-setup:
    name: web · install + cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci

  web-lint:
    name: web · Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    needs: web-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: ESLint
        working-directory: web
        run: npm run lint
      - name: Prettier (check)
        working-directory: web
        run: npm run format:check

  web-typecheck:
    name: web · TypeScript (strict)
    runs-on: ubuntu-latest
    needs: web-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: tsc --noEmit
        working-directory: web
        run: npm run typecheck

  web-test:
    name: web · Vitest
    runs-on: ubuntu-latest
    needs: web-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Vitest
        working-directory: web
        run: npm run test

  web-build:
    name: web · Vite build
    runs-on: ubuntu-latest
    needs: [web-lint, web-typecheck, web-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  web-locale-sync:
    name: web · Locale key sync (en ↔ fa)
    runs-on: ubuntu-latest
    needs: web-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: check-locales
        working-directory: web
        run: npm run i18n:check

  web-openapi-sync:
    name: web · openapi-fetch schema in sync
    runs-on: ubuntu-latest
    needs: web-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: check-openapi-sync
        working-directory: web
        run: npm run openapi:check

  # --------------------------------------------------------------------------
  # Marketing SPA (website/)
  #
  # Same pipeline (lint, typecheck, test, build, locale sync). The build
  # runs vite-react-ssg, which prerenders one index.html per route and
  # emits sitemap.xml + robots.txt into dist/.
  # --------------------------------------------------------------------------
  website-setup:
    name: website · install + cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci

  website-lint:
    name: website · Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    needs: website-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: ESLint
        working-directory: website
        run: npm run lint
      - name: Prettier (check)
        working-directory: website
        run: npm run format:check

  website-typecheck:
    name: website · TypeScript (strict)
    runs-on: ubuntu-latest
    needs: website-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: tsc --noEmit
        working-directory: website
        run: npm run typecheck

  website-test:
    name: website · Vitest
    runs-on: ubuntu-latest
    needs: website-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Vitest
        working-directory: website
        run: npm run test

  website-build:
    name: website · vite-react-ssg build
    runs-on: ubuntu-latest
    needs: [website-lint, website-typecheck, website-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: Build (SSG + sitemap)
        working-directory: website
        run: npm run build
      - name: Verify prerendered HTML
        working-directory: website
        run: |
          for route in index features pricing about docs blog legal/privacy legal/terms; do
            test -f "dist/${route}.html" || { echo "::error::missing prerendered dist/${route}.html"; exit 1; }
          done
          test -f dist/sitemap.xml || { echo "::error::missing dist/sitemap.xml"; exit 1; }
          test -f dist/robots.txt  || { echo "::error::missing dist/robots.txt";  exit 1; }
          echo "✅ prerendered HTML + sitemap + robots all present"
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: website-dist
          path: website/dist
          retention-days: 7

  website-locale-sync:
    name: website · Locale key sync (en ↔ fa)
    runs-on: ubuntu-latest
    needs: website-setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: website/package-lock.json
      - name: Install
        working-directory: website
        run: npm ci
      - name: check-locales
        working-directory: website
        run: npm run i18n:check
