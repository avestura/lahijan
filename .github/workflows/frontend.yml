# Lahijan frontend CI - dashboard SPA (web/)
#
# Runs on every push to main and on every PR that touches the dashboard or
# the OpenAPI spec. The pipeline is:
#
#   install -> lint -> typecheck -> test -> build
#                             \-> i18n locale sync check
#                             \-> openapi-fetch schema sync check
#
# A failure on any step blocks merge. The bundle-size check is informational
# for now (printed as a build artefact summary).

name: Frontend

on:
  push:
    branches: [main]
    paths:
      - web/**
      - api/openapi.yaml
      - api/gen/ts/**
      - api/gen/ts-client/**
      - .github/workflows/frontend.yml
  pull_request:
    paths:
      - web/**
      - api/openapi.yaml
      - api/gen/ts/**
      - api/gen/ts-client/**
      - .github/workflows/frontend.yml

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  setup:
    name: Install + cache
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci

  lint:
    name: Lint (ESLint + Prettier)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: ESLint
        working-directory: web
        run: npm run lint
      - name: Prettier (check)
        working-directory: web
        run: npm run format:check

  typecheck:
    name: TypeScript (strict)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: tsc --noEmit
        working-directory: web
        run: npm run typecheck

  test:
    name: Vitest
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Vitest
        working-directory: web
        run: npm run test

  build:
    name: Vite build (bundle <500 KiB gzipped)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build
        working-directory: web
        run: npm run build
      - name: Upload artefact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  locale-sync:
    name: Locale key sync (en ↔ fa)
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: check-locales
        working-directory: web
        run: npm run i18n:check

  openapi-sync:
    name: openapi-fetch schema in sync
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: check-openapi-sync
        working-directory: web
        run: npm run openapi:check
