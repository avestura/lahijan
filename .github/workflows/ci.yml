# Lahijan CI - Go backend
#
# Runs on every push to main and on every PR. Installs golangci-lint via the
# official installer so we don't need a separate lint workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.5.0
          args: --timeout=10m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build -ldflags "-X 'github.com/avestura/lahijan/internal/app/lahijan/version.LahijanVersion=ci'" ./cmd/lahijan

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Test
        run: make test-race

  mod-tidy:
    name: go mod tidy (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go mod tidy
        run: go mod tidy
      - name: check for diff
        run: |
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

  fmt:
    name: gofumpt (check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@latest
      - name: check formatting
        run: |
          if ! gofumpt -l . | grep -E '.'; then
            echo "all files formatted correctly"
            exit 0
          fi
          echo "::error::some files are not gofumpt-formatted:"
          gofumpt -l .
          exit 1

  integration:
    name: Integration tests (testcontainers)
    runs-on: ubuntu-latest
    # Integration tests light up real Postgres via testcontainers-go (Docker is
    # available on GitHub-hosted ubuntu runners). Gated to changes that touch
    # the database layer so the rest of the backend stays fast.
    #
    # The full integration suite (`make test-integration`) lives in the
    # E2E workflow (`.github/workflows/e2e.yml`) and is label-gated on
    # PRs (`run:integration`). This job runs only the database-package
    # subset on every PR for fast feedback on migration / sqlc changes.
    if: |
      github.ref == 'refs/heads/main' ||
      contains(github.event.head_commit.modified, 'internal/app/lahijan/database/') ||
      contains(github.event.pull_request.labels.*.name, 'run:integration')
    steps:
      - uses: actions/checkout@v4
        with:
          # We need the full history for path-filter checks; the default
          # shallow clone is enough for `go test` itself.
          fetch-depth: 1
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run integration tests
        run: go test -tags integration -timeout 600s ./internal/app/lahijan/database/...
        env:
          TESTCONTAINERS_RYUK_DISABLED: "true"

  # Builds the Lahijan server image on every run (so a broken Dockerfile fails
  # the PR) and pushes it to GHCR only for pushes to main, after every other
  # job in this workflow has passed (a skipped job does not block it).
  docker:
    name: Docker image (build + push)
    runs-on: ubuntu-latest
    needs: [lint, build, test, mod-tidy, fmt, integration]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,prefix=sha-
            type=ref,event=pr
      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LAHIJAN_IMAGE_TAG=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

