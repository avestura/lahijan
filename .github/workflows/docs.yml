# Docs CI - build & lint the Docusaurus site
#
# Skips if docs-site/ doesn't exist yet (it will land with WS-02).

name: Docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - docs-site/**
      - .github/workflows/docs.yml

jobs:
  build:
    name: Build docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Check docs-site exists
        id: exists
        run: |
          if [ -d docs-site ]; then
            echo "present=true" >> $GITHUB_OUTPUT
          else
            echo "present=false" >> $GITHUB_OUTPUT
            echo "docs-site/ not yet scaffolded; skipping"
          fi
      - name: Install
        if: steps.exists.outputs.present == 'true'
        working-directory: docs-site
        run: npm ci
      - name: Build
        if: steps.exists.outputs.present == 'true'
        working-directory: docs-site
        run: npm run build
